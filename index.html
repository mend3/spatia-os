<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>espatial-os</title>

<!--
  Importmap em vez de bundler: `three` resolve para o arquivo vendorizado, e os módulos de
  postprocessing (que importam o bare specifier 'three') funcionam sem build. Zero npm,
  zero passo de compilação, e a página abre offline.
-->
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js" } }
</script>

<style>
  /*
    HUD militar: monoespaçado pequeno, hairlines de 1px, muito vazio.
    Sem card, sem borda-caixa, sem sombra. O que separa seção é espaço.
    A paleta é âmbar quente sobre preto — a mesma do disco de acreção, para que a
    interface pareça iluminada pelo núcleo em vez de sobreposta a ele.
  */
  :root {
    --void: #04060a;
    --amber: #ffb35c;
    --amber-dim: #b8763a;
    --ink: #e8dfd2;
    --ink-dim: #7d8797;
    --ink-faint: #4a5261;
    --line: rgba(255, 179, 92, 0.16);
    --good: #6ee7a0;
    --bad: #ff6b52;
    --busy: #ffd257;
    --hud-font: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --gutter: clamp(14px, 2vw, 34px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--void);
    color: var(--ink);
    font-family: var(--hud-font);
    font-size: 11px;
    letter-spacing: 0.06em;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #space { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  /* A HUD não intercepta o mouse: arrastar a câmera tem que funcionar em qualquer lugar.
     Só os controles reais reativam ponteiro. */
  #hud {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: minmax(230px, 20vw) 1fr minmax(230px, 20vw);
    grid-template-rows: auto 1fr auto;
    padding: var(--gutter);
    gap: clamp(10px, 1.4vh, 22px) var(--gutter);
    pointer-events: none;
    transition: opacity 900ms ease;
  }
  #hud a, #hud button, #hud input, #hud .clickable { pointer-events: auto; }

  /* Modo cinematográfico: TAB apaga tudo, sobra o núcleo, a voz e o texto. */
  body.cinematic #hud > *:not(.keep-cinematic) { opacity: 0; }
  body.cinematic #hud { gap: 0; }

  h1, h2 { font-size: 11px; font-weight: 500; letter-spacing: 0.24em; }

  .label {
    color: var(--amber-dim);
    font-size: 9px;
    letter-spacing: 0.3em;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 9px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .label i { font-style: normal; color: var(--ink-faint); }

  /* ---------------- topo ---------------- */

  header { grid-column: 1 / -1; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }

  /* Micro-grid de estado residente: dois pares por linha, valor em destaque. */
  .headstat { display: grid; grid-template-columns: repeat(2, auto auto); gap: 2px 9px;
              align-items: baseline; }
  .hs-label { color: var(--ink-faint); font-size: 7.5px; letter-spacing: 0.2em; }
  .hs-value { color: var(--ink); font-size: 11px; font-variant-numeric: tabular-nums;
              letter-spacing: 0.04em; }
  .hs-value[data-tone="warn"] { color: var(--busy); }
  .hs-value[data-tone="bad"] { color: var(--bad); }
  .hs-value[data-tone="good"] { color: var(--good); }

  .status { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .status-state { display: flex; align-items: center; gap: 7px; color: var(--amber); letter-spacing: 0.26em; }

  /*
    O contêiner dos indicadores precisa ser flex por conta própria.
    O `gap` do `.status` separa os dois blocos (estado | serviços), não os itens DENTRO do
    segundo — e um `<span>` inline empilha os `.svc` sem folga nenhuma, deixando o ponto de
    um serviço colado no rótulo do anterior.
  */
  .status-services { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }

  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-faint); display: inline-block; }
  .dot[data-status="on"], .dot[data-state="idle"] { background: var(--good); box-shadow: 0 0 7px var(--good); }
  .dot[data-status="busy"] { background: var(--busy); box-shadow: 0 0 7px var(--busy); animation: throb 1.1s infinite; }
  .dot[data-status="off"], .dot[data-state="error"] { background: var(--bad); box-shadow: 0 0 7px var(--bad); }
  .dot[data-state="thinking"], .dot[data-state="answering"],
  .dot[data-state="retrieving"], .dot[data-state="searching"] {
    background: var(--amber); box-shadow: 0 0 9px var(--amber); animation: throb 0.85s infinite;
  }
  @keyframes throb { 50% { opacity: 0.25; } }

  .svc { display: inline-flex; align-items: center; gap: 5px; }
  .svc-label { color: var(--ink-faint); font-size: 8.5px; letter-spacing: 0.2em; }

  .clockbox { text-align: right; }
  .clockbox strong { font-size: 26px; font-weight: 300; color: var(--ink); letter-spacing: 0.05em; }
  .clockbox sub { font-size: 12px; color: var(--amber-dim); vertical-align: baseline; }
  .clockbox div { color: var(--ink-faint); font-size: 8.5px; letter-spacing: 0.22em; }

  /* ---------------- colunas ---------------- */

  aside { display: flex; flex-direction: column; gap: clamp(10px, 2vh, 24px); min-height: 0; overflow: hidden; }
  aside section { min-height: 0; display: flex; flex-direction: column; }
  .scroll { overflow: hidden; display: flex; flex-direction: column; gap: 4px; }

  .vital { display: grid; grid-template-columns: 1fr auto auto; align-items: baseline; gap: 6px; padding: 3px 0; }
  .vital-label { color: var(--ink-faint); font-size: 8.5px; letter-spacing: 0.18em; }
  .vital-value { color: var(--ink); font-size: 14px; font-weight: 400; }
  .vital-unit { color: var(--ink-faint); font-size: 8px; }

  .row { animation: slide-in 320ms cubic-bezier(0.16, 1, 0.3, 1) both; display: grid; grid-template-columns: auto 1fr auto; gap: 7px; padding: 2px 0; color: var(--ink-dim); }
  .row-time { color: var(--ink-faint); }
  .row-meta { color: var(--amber-dim); font-size: 9px; }
  .row.dim { color: var(--ink-faint); }
  .row.good .row-text { color: var(--good); }
  .row.bad .row-text { color: var(--bad); }

  .plan-step { display: grid; grid-template-columns: auto 1fr auto; gap: 7px; align-items: center; padding: 2px 0; }
  .plan-mark { width: 4px; height: 4px; background: var(--amber-dim); display: block; }
  .plan-label { color: var(--ink-dim); font-size: 9.5px; }
  .plan-target { color: var(--ink-faint); font-size: 8px; }

  .hit { animation: slide-in 380ms cubic-bezier(0.16, 1, 0.3, 1) both; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .hit-head { display: flex; gap: 7px; }
  .hit-score { color: var(--amber); }
  .hit-path { color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit-section { color: var(--ink-faint); font-size: 9px; }
  .hit-text { color: var(--ink-faint); font-size: 9px; line-height: 1.45; max-height: 2.9em; overflow: hidden; }

  .tool { animation: slide-in 300ms cubic-bezier(0.16, 1, 0.3, 1) both; padding: 2px 0; display: grid; grid-template-columns: auto 1fr auto; gap: 7px; align-items: center; }
  .tool-dot { width: 5px; height: 5px; border-radius: 50%; display: block; }
  .tool-name { color: var(--ink-dim); }
  .tool-meta { color: var(--ink-faint); font-size: 9px; }
  .tool-detail { grid-column: 2 / -1; color: var(--ink-faint); font-size: 8.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tool.done .tool-name { color: var(--ink); }
  .tool.bad .tool-name { color: var(--bad); }

  .web-item { padding: 3px 0; }
  .web-item.off { opacity: 0.4; }
  .web-provider { color: var(--amber-dim); font-size: 8px; letter-spacing: 0.2em; margin-right: 6px; }
  .web-title { color: var(--ink-dim); font-size: 9.5px; text-decoration: none; }
  a.web-title:hover { color: var(--amber); }
  .web-snippet { color: var(--ink-faint); font-size: 8.5px; line-height: 1.4; max-height: 2.8em; overflow: hidden; }

  /* ---------------- centro: resposta ---------------- */

  .stage { grid-column: 2; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-height: 0; gap: 10px; }

  /*
    Prosa alinhada à esquerda, largura de leitura, e um scrim atrás.
    A primeira versão centralizava o texto: bonito em uma frase, ilegível em seis — cada
    linha começa num x diferente e o olho perde o ponto de retorno. O scrim existe porque
    texto sobre o disco de acreção não tem contraste garantido em nenhuma cor.
  */
  .answer {
    max-width: min(680px, 94%);
    width: 100%;
    text-align: left;
    font-size: 12.5px;
    line-height: 1.72;
    color: var(--ink);
    letter-spacing: 0.02em;
    max-height: 36vh;
    overflow-y: auto;
    padding: 14px 18px;
    background: linear-gradient(180deg, rgba(4,6,10,0) 0%, rgba(4,6,10,0.82) 12%, rgba(4,6,10,0.82) 88%, rgba(4,6,10,0) 100%);
    backdrop-filter: blur(2px);
    pointer-events: auto;
  }
  .answer:empty { display: none; }
  /* Nada entra em corte seco: bloco novo nasce transparente e deslizando de baixo. */
  .answer, .sources, .answer-meta { animation: rise 520ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .answer-p { margin: 0 0 0.85em; }
  .answer-p:last-child { margin-bottom: 0; }
  .answer-list { margin: 0 0 0.85em; padding-left: 1.1em; list-style: none; }
  .answer-list li { position: relative; margin-bottom: 0.35em; }
  .answer-list li::before {
    content: '·'; position: absolute; left: -1em; color: var(--amber-dim);
  }
  .answer-strong { color: #fff; font-weight: 500; }
  .answer-code {
    font-family: inherit; font-size: 11.5px; color: var(--amber);
    background: rgba(255, 179, 92, 0.09); padding: 0 4px; border-radius: 2px;
  }
  .answer-error { color: var(--bad); font-size: 10px; margin-top: 8px; }

  /* Só aparece quando há resposta na tela — botão de fechar o que não existe é ruído. */
  .answer-dismiss {
    align-self: flex-end; background: none; border: 1px solid var(--line);
    color: var(--ink-faint); font: inherit; font-size: 8px; letter-spacing: 0.22em;
    padding: 4px 9px; cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity 260ms ease, color 160ms ease;
  }
  .stage.has-answer .answer-dismiss { opacity: 1; pointer-events: auto; }
  .answer-dismiss:hover { color: var(--amber); border-color: var(--amber-dim); }

  .cite {
    background: none; border: none; cursor: pointer; font: inherit;
    color: var(--amber); padding: 0 2px;
  }
  .cite:hover { color: #fff; }
  .cite.invalid { color: var(--ink-faint); text-decoration: line-through; cursor: not-allowed; }

  .answer-meta { color: var(--ink-faint); font-size: 8.5px; letter-spacing: 0.2em; }

  .sources { display: flex; flex-direction: column; gap: 2px; max-width: min(680px, 94%); width: 100%; padding: 0 18px; }
  .source { display: grid; grid-template-columns: auto 1fr auto; gap: 7px; font-size: 9px; color: var(--ink-faint); }
  .source-n { color: var(--amber-dim); }
  .source-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; text-decoration: none; color: inherit; }
  .source-label:hover { color: var(--amber); }
  .source.active { color: var(--ink); }
  .source.active .source-n { color: var(--amber); }

  /* ---------------- rodapé: terminal ---------------- */

  footer { grid-column: 1 / -1; display: flex; flex-direction: column; gap: 8px; }

  /* Três zonas: compositor (elástico), forma de onda, configuração. */
  .prompt-line { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: var(--gutter);
                 border-top: 1px solid var(--line); padding-top: 10px; }

  /*
    O compositor tem moldura própria — é o que declara "isto aqui é um campo, e estes botões
    são dele". Sem a moldura, anexo e mic ficavam visualmente indistinguíveis dos toggles de
    configuração ao lado.
  */
  .composer {
    display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 9px;
    border: 1px solid var(--line); padding: 5px 8px 5px 11px;
    transition: border-color 200ms ease;
  }
  .composer:focus-within { border-color: var(--amber-dim); }
  .prompt-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  .prompt-caret { color: var(--amber); font-size: 15px; }
  .prompt-wrap { position: relative; }
  .prompt-wrap input {
    width: 100%; background: none; border: none; outline: none;
    color: var(--ink); font: inherit; font-size: 13px; letter-spacing: 0.05em; caret-color: var(--amber);
  }
  .prompt-ghost { position: absolute; inset: 0; color: var(--ink-faint); pointer-events: none; font-size: 13px; }

  canvas.waveform { width: 110px; height: 24px; }

  /*
    Botão de ação que muda de papel: mic quando não há texto, enviar quando há, parar quando
    está gravando. É o padrão do WhatsApp/Telegram, e resolve o problema que o "segure espaço"
    tinha por construção — não existe tecla envolvida, então falar nunca digita.
  */
  .icon-btn {
    pointer-events: auto; background: none; border: 1px solid var(--line); cursor: pointer;
    width: 30px; height: 26px; display: inline-flex; align-items: center; justify-content: center;
    padding: 0; transition: border-color 180ms ease, background 180ms ease;
  }
  .icon-btn svg { width: 15px; height: 15px; fill: none; stroke: var(--ink-dim);
                  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .icon-btn:hover { border-color: var(--amber-dim); }
  .icon-btn:hover svg { stroke: var(--amber); }
  .icon-btn.primary { border-color: var(--amber-dim); }
  .icon-btn.primary svg { stroke: var(--amber); }
  /* Um SVG por modo; só o do modo ativo é exibido. */
  .icon-btn .ico-mic, .icon-btn .ico-send, .icon-btn .ico-stop { display: none; }
  .icon-btn[data-mode="mic"] .ico-mic,
  .icon-btn[data-mode="send"] .ico-send,
  .icon-btn[data-mode="stop"] .ico-stop { display: block; }
  .icon-btn[data-mode="send"] { background: var(--amber); border-color: var(--amber); }
  .icon-btn[data-mode="send"] svg { stroke: var(--void); }
  .icon-btn[data-mode="stop"] { border-color: var(--bad); }
  .icon-btn[data-mode="stop"] svg { stroke: var(--bad); fill: var(--bad);
                                    animation: throb 1s infinite; }

  .attachments { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; }
  .attachments:empty { display: none; }
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
          padding: 3px 7px; font-size: 8px; letter-spacing: 0.14em; color: var(--ink-dim);
          pointer-events: auto; }
  .chip-drop { background: none; border: none; color: var(--ink-faint); cursor: pointer;
               font: inherit; font-size: 11px; line-height: 1; padding: 0; }
  .chip-drop:hover { color: var(--bad); }
  .chip.pending { opacity: 0.5; }

  .toggle {
    background: none; border: 1px solid var(--line); color: var(--ink-faint);
    font: inherit; font-size: 8.5px; letter-spacing: 0.2em; padding: 4px 9px; cursor: pointer;
  }
  .toggle[data-on="true"] { color: var(--amber); border-color: var(--amber-dim); }

  .footer-hints { display: flex; justify-content: space-between; color: var(--ink-faint); font-size: 8px; letter-spacing: 0.2em; }

  /* ---------------- inspetor e hover ---------------- */

  .inspector {
    position: fixed; right: var(--gutter); top: 20vh; width: min(420px, 34vw);
    max-height: 56vh; display: none; flex-direction: column; gap: 8px;
    background: linear-gradient(180deg, rgba(4,6,10,0.94), rgba(4,6,10,0.82));
    border-left: 1px solid var(--amber-dim); padding: 12px 14px; pointer-events: auto; overflow: hidden;
  }
  .inspector .label { align-items: center; }
  .inspector-close {
    background: none; border: none; color: var(--ink-faint); font: inherit; font-size: 15px;
    line-height: 1; cursor: pointer; padding: 0 2px; transition: color 160ms ease;
  }
  .inspector-close:hover { color: var(--amber); }
  .inspector.open { display: flex; animation: rise 460ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  .inspector-body { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .chunk-section { color: var(--amber-dim); font-size: 8.5px; letter-spacing: 0.2em; }
  .chunk-text { color: var(--ink-dim); font-size: 9.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; font-family: inherit; }

  .hover {
    position: fixed; left: 50%; bottom: 15vh; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    opacity: 0; transition: opacity 180ms ease;
  }
  .hover.on { opacity: 1; }
  .hover-label { color: var(--ink); font-size: 11px; letter-spacing: 0.16em; }
  .hover-meta { color: var(--ink-faint); font-size: 8.5px; letter-spacing: 0.2em; }

  /* ---------------- fendas de widget, dock e corpos ---------------- */

  #hud { grid-template-rows: auto 1fr auto auto; }
  .slot[data-slot="strip"] { grid-column: 1 / -1; display: flex; gap: var(--gutter); }
  .slot[data-slot="strip"]:empty { display: none; }

  .widget { display: flex; flex-direction: column; min-height: 0; }
  .widget-stage { flex: 1; justify-content: flex-end; align-items: center; gap: 10px; }
  .widget-body { min-height: 0; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .widget-stage > .widget-body { width: 100%; align-items: center; }
  .widget-error { color: var(--bad); font-size: 9px; }
  .widget-empty { color: var(--ink-faint); font-size: 9px; line-height: 1.5; }
  .widget-hint { font-style: normal; color: var(--ink-faint); }

  /* Depósito: fora de tela, dentro do documento — nó removido perde medida. */
  .attic { position: fixed; left: -9999px; top: 0; width: 320px; height: 1px; overflow: hidden; }

  /*
    Transição de rota. Os widgets somem no começo do voo e voltam perto do fim; o router
    escalona os dois instantes, e é esse desalinho que faz ler como chegada, não como corte.
  */
  #hud .slot { transition: opacity 380ms ease, transform 520ms cubic-bezier(0.16, 1, 0.3, 1); }
  body.in-flight #hud .slot { opacity: 0; transform: translateY(12px); }

  /* Dock: os apps como destinos, com o atalho numérico visível. */
  .dock { grid-column: 1 / -1; display: flex; gap: 6px; justify-content: center;
          padding-top: 6px; }
  .dock-item {
    pointer-events: auto; background: none; border: 1px solid var(--line); cursor: pointer;
    color: var(--ink-faint); font: inherit; font-size: 8.5px; letter-spacing: 0.2em;
    padding: 5px 11px; display: inline-flex; align-items: center; gap: 7px;
    transition: color 180ms ease, border-color 180ms ease, background 180ms ease;
  }
  .dock-item:hover { color: var(--ink); border-color: var(--amber-dim); }
  .dock-item[data-active="true"] { color: var(--void); background: var(--dock-color, var(--amber));
                                   border-color: transparent; }
  .dock-key { color: var(--ink-faint); font-size: 7.5px; }
  .dock-item[data-active="true"] .dock-key { color: rgba(0,0,0,0.5); }
  .dock-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--dock-color, var(--amber)); }
  .dock-item[data-active="true"] .dock-dot { background: var(--void); }

  /* Rótulos dos corpos: DOM posicionado pela projeção da câmera, para usar a fonte da HUD. */
  #bodies { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .body-label {
    position: absolute; top: 0; left: 0; pointer-events: auto; cursor: pointer;
    background: none; border: none; font: inherit; font-size: 9px; letter-spacing: 0.22em;
    color: var(--ink-dim); display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap; padding: 3px 6px; transition: color 160ms ease;
  }
  .body-label:hover, .body-label[data-active="true"] { color: var(--body-color); }
  .body-key { color: var(--ink-faint); font-size: 7.5px; border: 1px solid var(--line); padding: 0 3px; }
  /* Controle: rótulo menor e mais discreto que app — ele alterna algo, não é destino. */
  .body-label.body-control { font-size: 7.5px; letter-spacing: 0.26em; }
  .body-label.body-control .body-name { opacity: 0.75; }

  /* ---------------- widgets dos apps ---------------- */

  .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 0; align-items: baseline; }
  .kv-label { color: var(--ink-faint); font-size: 8.5px; letter-spacing: 0.18em; }
  .kv-value { color: var(--ink); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; max-width: 15em; }

  .unit { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center;
          padding: 4px 0; }
  .unit.down { opacity: 0.45; }
  .unit-name { color: var(--ink-dim); font-size: 9.5px; letter-spacing: 0.12em; }
  .unit-detail { color: var(--ink-faint); font-size: 8.5px; }
  .unit-sub { grid-column: 2 / -1; color: var(--ink-faint); font-size: 8px; line-height: 1.5; }

  .fs-crumb { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; padding-bottom: 6px;
              border-bottom: 1px solid var(--line); margin-bottom: 5px; }
  .fs-crumb-part { background: none; border: none; color: var(--amber-dim); font: inherit;
                   font-size: 8.5px; cursor: pointer; padding: 0; }
  .fs-crumb-part:hover { color: var(--amber); }
  .fs-crumb-sep { color: var(--ink-faint); font-size: 8.5px; }
  .fs-row { display: grid; grid-template-columns: auto 1fr auto; gap: 7px; align-items: baseline;
            background: none; border: none; font: inherit; text-align: left; cursor: pointer;
            padding: 2px 0; color: var(--ink-dim); }
  .fs-row:hover { color: var(--ink); }
  .fs-glyph { color: var(--amber-dim); font-size: 8px; }
  .fs-name { font-size: 9.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fs-meta { color: var(--ink-faint); font-size: 8px; }
  .fs-dir .fs-name { color: var(--amber-dim); }
  .fs-title { color: var(--amber-dim); font-size: 8.5px; letter-spacing: 0.18em;
              padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .fs-search { width: 100%; background: none; border: none; border-bottom: 1px solid var(--line);
               color: var(--ink); font: inherit; font-size: 10px; outline: none; padding: 4px 0;
               margin-bottom: 6px; }

  .delivery { display: grid; grid-template-columns: auto auto 1fr auto; gap: 9px; align-items: baseline;
              padding: 3px 0; font-size: 9px; }
  .delivery-source { color: var(--amber-dim); font-size: 8px; letter-spacing: 0.18em; }
  .delivery-summary { color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .delivery-meta { color: var(--ink-faint); font-size: 8px; }

  /* Painel de voz: mesma moldura dos outros painéis de configuração, à esquerda. */
  .speech-panel { left: var(--gutter); right: auto;
                  border-left: 1px solid var(--amber-dim); border-right: none; }
  body.speech-open #hud > aside:first-of-type { opacity: 0; pointer-events: none; }
  .bench { display: flex; flex-direction: column; gap: 5px; padding-bottom: 4px; }
  .bench .perm-mode { align-self: flex-start; }
  .fs-row.on .fs-name { color: var(--amber); }
  .chips { display: flex; flex-direction: column; }

  /* ---------------- painel de afinação ---------------- */

  .controls {
    position: fixed; left: var(--gutter); bottom: 8vh; width: 268px;
    max-height: 74vh; overflow-y: auto; pointer-events: auto;
    display: none; flex-direction: column; gap: 1px;
    background: linear-gradient(180deg, rgba(4,6,10,0.95), rgba(4,6,10,0.88));
    border-left: 1px solid var(--amber-dim); padding: 12px 14px 14px;
    backdrop-filter: blur(3px);
  }
  /* Com o painel aberto a coluna esquerda sai de cena: é o mesmo espaço, um dono por vez. */
  /* Com o painel aberto a coluna esquerda sai de cena: é o mesmo espaço, um dono por vez. */
  #hud aside { transition: opacity 320ms ease; }
  #hud aside.dimmed { opacity: 0; pointer-events: none; }

  .controls { top: calc(var(--gutter) + 62px); bottom: auto; max-height: calc(100vh - 20vh); }
  .controls.open { display: flex; animation: rise 420ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  .controls-head { display: flex; justify-content: space-between; align-items: baseline;
                   border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
  .controls-title { color: var(--amber); font-size: 9px; letter-spacing: 0.34em; }
  .controls-reset { background: none; border: none; color: var(--ink-faint); font: inherit;
                    font-size: 8px; letter-spacing: 0.2em; cursor: pointer; }
  .controls-reset:hover { color: var(--amber); }
  .controls-group { color: var(--ink-faint); font-size: 8px; letter-spacing: 0.3em;
                    margin: 12px 0 4px; }
  .controls-group:first-of-type { margin-top: 0; }
  .controls-hint { color: var(--ink-faint); font-size: 7.5px; letter-spacing: 0.18em;
                   margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--line); }

  .control { display: flex; flex-direction: column; gap: 3px; padding: 3px 0; cursor: pointer; }
  .control-head { display: flex; justify-content: space-between; gap: 8px; }
  .control-label { color: var(--ink-dim); font-size: 8.5px; letter-spacing: 0.14em; }
  .control-value { color: var(--amber); font-size: 9px; font-variant-numeric: tabular-nums; }

  /* Slider hairline: trilha de 1px e polegar quadrado, para não parecer controle de sistema. */
  .control-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 10px;
                    background: none; cursor: pointer; }
  .control-slider::-webkit-slider-runnable-track { height: 1px; background: var(--line); }
  .control-slider::-moz-range-track { height: 1px; background: var(--line); }
  .control-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 8px; height: 8px; margin-top: -3.5px;
    background: var(--amber); border: none; transition: transform 140ms ease;
  }
  .control-slider::-moz-range-thumb { width: 8px; height: 8px; background: var(--amber); border: none; }
  .control-slider:hover::-webkit-slider-thumb { transform: scale(1.4); }

  /* ---------------- painel de permissões ---------------- */

  .perms {
    position: fixed; right: var(--gutter); top: calc(var(--gutter) + 62px);
    width: min(400px, 33vw); max-height: 78vh; pointer-events: auto;
    display: none; flex-direction: column;
    background: linear-gradient(180deg, rgba(4,6,10,0.96), rgba(4,6,10,0.9));
    border-right: 1px solid var(--amber-dim); padding: 12px 14px 14px;
    backdrop-filter: blur(3px);
  }
  .perms.open { display: flex; animation: rise 420ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  /* Com as permissões abertas a coluna direita sai: mesmo espaço, um dono por vez. */
  body.perms-open #hud > aside:last-of-type { opacity: 0; pointer-events: none; }
  .perms-body { overflow-y: auto; display: flex; flex-direction: column; gap: 1px; min-height: 0; }
  .perms-status { color: var(--ink-faint); font-size: 8px; letter-spacing: 0.16em; }

  .perm { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start;
          padding: 4px 0; cursor: pointer; }
  .perm.off { opacity: 0.42; }
  .perm-box { appearance: none; -webkit-appearance: none; width: 9px; height: 9px; margin-top: 3px;
              border: 1px solid var(--ink-faint); background: none; cursor: pointer;
              transition: background 160ms ease, border-color 160ms ease; }
  .perm-box:checked { background: var(--amber); border-color: var(--amber); }
  .perm-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .perm-name { color: var(--ink); font-size: 9.5px; letter-spacing: 0.1em; }
  /* Mesma paleta de família das ferramentas na cena: o olho já aprendeu essas cores. */
  .perm-name[data-kind="filesystem"] { color: #6ee7a0; }
  .perm-name[data-kind="shell"] { color: #d8c9a8; }
  .perm-name[data-kind="browser"] { color: #ff9b4a; }
  .perm-name[data-kind="agent"] { color: #c59bff; }
  .perm-name[data-kind="planner"] { color: #8fa3bd; }
  .perm-desc { color: var(--ink-faint); font-size: 8.5px; line-height: 1.4;
               max-height: 2.9em; overflow: hidden; }
  .perm-empty { color: var(--ink-faint); font-size: 8.5px; padding: 3px 0; }

  .perm-modes { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 0 6px; }
  .perm-mode { background: none; border: 1px solid var(--line); color: var(--ink-faint);
               font: inherit; font-size: 8px; letter-spacing: 0.14em; padding: 3px 7px;
               cursor: pointer; transition: color 160ms ease, border-color 160ms ease; }
  .perm-mode.on { color: var(--void); background: var(--amber); border-color: var(--amber); }
  .perm-mode:hover:not(.on) { color: var(--amber); border-color: var(--amber-dim); }

  .perms-flagsbox { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
  .perms-flags { display: block; color: var(--ink-dim); font-size: 8px; line-height: 1.55;
                 word-break: break-all; font-family: inherit; }
  .perms-hint { color: var(--ink-faint); font-size: 7.5px; letter-spacing: 0.18em; margin-top: 10px; }

  /* ---------------- boot ---------------- */

  #boot {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(circle at 50% 45%, #0b0806 0%, var(--void) 62%);
    transition: opacity 1.2s ease, filter 1.2s ease;
  }
  #boot.gone { opacity: 0; filter: blur(14px); pointer-events: none; }
  #boot h1 { color: var(--amber); letter-spacing: 0.7em; font-size: 20px; }
  #boot .sub { color: var(--ink-faint); font-size: 9px; letter-spacing: 0.32em; }
  .boot-log { display: flex; flex-direction: column; gap: 3px; width: min(560px, 84vw); margin-top: 8px; }
  .boot-line { display: grid; grid-template-columns: 1fr auto; gap: 14px; font-size: 9.5px;
               border-bottom: 1px solid rgba(255,255,255,0.04); padding: 3px 0;
               animation: reveal 320ms ease both; }
  @keyframes reveal { from { opacity: 0; transform: translateY(-3px); } }
  @keyframes slide-in { from { opacity: 0; transform: translateX(-6px); } }
  .boot-label { color: var(--ink-faint); letter-spacing: 0.2em; }
  .boot-line.ok .boot-value { color: var(--ink-dim); }
  .boot-line.bad .boot-label, .boot-line.bad .boot-value { color: var(--bad); }
  .boot-status { color: var(--ink-dim); font-size: 9.5px; letter-spacing: 0.16em; min-height: 1.2em; }
  #boot button {
    background: none; border: 1px solid var(--amber-dim); color: var(--amber);
    font: inherit; font-size: 11px; letter-spacing: 0.4em; padding: 12px 34px; cursor: pointer;
    transition: background 240ms ease, color 240ms ease;
  }
  #boot button:hover:not(:disabled) { background: var(--amber); color: var(--void); }
  #boot button:disabled { border-color: var(--ink-faint); color: var(--ink-faint); cursor: default; }

  @media (max-width: 900px) {
    #hud { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
    aside { display: none; }
    .stage { grid-column: 1; }
  }
</style>
</head>
<body>

<canvas id="space"></canvas>

<div id="bodies"></div>

<div id="hud">
  <header>
    <!--
      Aqui havia logo e slogan. Identidade não muda, então não merece espaço permanente — e a
      aba do browser já diz o nome. O canto passa a mostrar o que precisa ser verdade em TODO
      app e que não aparecia em nenhum: idade do índice (a métrica que envelhece em silêncio),
      janela de uso e custo da sessão.
    -->
    <div class="headstat" data-headstat></div>

    <div class="status">
      <span class="status-state">
        <i class="dot" data-state-dot data-state="boot"></i>
        <span data-state-label>INICIANDO</span>
      </span>
      <span class="status-services" data-services></span>
    </div>

    <div class="clockbox">
      <strong><span data-clock-time>--:--</span><sub>:<span data-clock-seconds>--</span></sub></strong>
      <div data-clock-date>—</div>
    </div>
  </header>

  <aside class="slot" data-slot="left"></aside>
  <div class="stage slot keep-cinematic" data-slot="stage"></div>
  <aside class="slot" data-slot="right"></aside>

  <div class="slot strip" data-slot="strip"></div>

  <nav class="dock" data-dock></nav>

  <footer class="keep-cinematic">
    <div class="attachments" data-attachments></div>
    <div class="prompt-line">
      <!--
        O COMPOSITOR: tudo que participa de escrever uma pergunta mora dentro dele — caret,
        campo, anexo e o botão de ação. Anexo e mic eram irmãos no grid, ao lado dos toggles de
        configuração, e liam como se fossem mais dois toggles. Fechá-los na mesma moldura do
        campo é o que faz o olho entender que pertencem ao ato de compor, não ao de configurar.
      -->
      <div class="composer">
        <span class="prompt-caret">›</span>
        <span class="prompt-wrap">
          <input data-prompt autocomplete="off" spellcheck="false" aria-label="pergunta ao núcleo">
          <span class="prompt-ghost" data-prompt-ghost>faça uma pergunta ao núcleo</span>
        </span>

        <input type="file" data-attach-input multiple hidden
               accept="image/*,audio/*,video/*,.pdf,.txt,.md,.json,.csv,.log,.py,.js,.ts,.yaml,.yml">
        <button class="icon-btn" data-attach-btn title="anexar arquivo, imagem ou áudio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5l-6 6a2.5 2.5 0 003.5 3.5l6-6a4 4 0 00-5.7-5.7l-6.5 6.5a5.5 5.5 0 007.8 7.8l5-5"/></svg>
        </button>

        <!--
          Um botão, três papéis: mic sem texto, enviar com texto, parar gravando.
          O modo é derivado do estado (input + reconhecimento), nunca guardado — estado
          duplicado entre o que o botão mostra e o que ele faz é como o botão passa a mentir.
        -->
        <button class="icon-btn primary" data-send-btn data-mode="mic" title="falar">
          <svg class="ico-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 013 3v5a3 3 0 01-6 0V6a3 3 0 013-3z"/><path d="M6 11a6 6 0 0012 0M12 17v4"/></svg>
          <!-- Ponta em x=20 (direita). A versão anterior começava em `M4 12` e ia até x=20,
               ou seja, ponta à ESQUERDA — um "enviar" apontando para trás. -->
          <svg class="ico-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12L4 4l6 8-6 8z"/></svg>
          <svg class="ico-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
        </button>
      </div>

      <canvas class="waveform" data-waveform></canvas>

      <!-- Configuração, não composição: cluster próprio, separado do compositor. -->
      <div class="prompt-tools">
        <button class="toggle" data-voice-toggle data-on="false">VOZ · OFF</button>
        <button class="toggle" data-speech-toggle data-on="false">CONFIG VOZ</button>
        <button class="toggle" data-perms-toggle data-on="false">PERMISSÕES</button>
        <button class="toggle" data-tune-toggle data-on="false">AFINAR</button>
        <button class="toggle" data-web-toggle data-on="false">WEB · AUTO</button>
      </div>
    </div>
    <div class="footer-hints">
      <span data-voice-hint></span>
      <span>TAB CINEMA · ` AFINAR · P PERMISSÕES · V CONFIG VOZ · 1-4 APPS · ESC SAIR · ⌘M MUDO</span>
    </div>
  </footer>

  <div class="inspector" data-inspector>
    <div class="label">
      <span data-inspector-title>—</span>
      <button class="inspector-close" data-inspector-close aria-label="fechar">×</button>
    </div>
    <div class="inspector-body" data-inspector-body></div>
  </div>

  <div class="hover" data-hover>
    <span class="hover-label" data-hover-label></span>
    <span class="hover-meta" data-hover-meta></span>
  </div>
</div>

<!--
  Depósito dos nós que os widgets adotam.
  Eles nascem aqui e são movidos para a fenda do widget na montagem; ao desmontar, voltam.
  Ficam DENTRO do documento de propósito: nó removido perde getBoundingClientRect, e o
  inspetor e o waveform dependem de medida real.
-->
<div class="attic" aria-hidden="true">
  <div data-vitals></div>
  <div data-plan class="scroll"></div>
  <div data-timeline class="scroll"></div>
  <div data-memory class="scroll"></div>
  <div data-tools class="scroll"></div>
  <div data-web class="scroll"></div>
  <button class="answer-dismiss" data-answer-dismiss>FECHAR · ESC</button>
  <div class="answer" data-answer></div>
  <div class="answer-meta" data-answer-meta></div>
  <div class="sources" data-sources></div>
</div>

<div id="boot">
  <h1>ESPATIAL</h1>
  <span class="sub">SISTEMA OPERACIONAL ESPACIAL DE CONHECIMENTO</span>
  <div class="boot-log" data-boot-log></div>
  <div class="boot-status" data-boot-status>verificando subsistemas…</div>
  <button data-boot-engage disabled>VERIFICANDO…</button>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
