<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<title>Bancada das SUPERFÍCIES — SpatIA</title>
<!--
  A BANCADA DAS SUPERFÍCIES — o storybook do que é 2D, e a irmã de `sandbox.html`.

  `sandbox.html` é a bancada dos objetos 3D: um corpo por vez, e **todo espécime IMPORTA o módulo
  real**. Esta é a mesma disciplina para o outro lado da tela — painel, fenda, moldura, composição.

  ## ☠️ ELA MONTA O APP DE VERDADE, e a primeira versão não montava

  A primeira versão reconstruía os painéis à mão: `tipo 1 ▮▮▯▯`, `pasta 1..10`, quatro linhas de
  contexto. Parecia o app e não era, e o defeito é o que esta base persegue em toda parte — a medida
  descrevia o PREENCHIMENTO de quem escreveu o espécime, não a tela. Reportado exatamente assim:
  *"os painéis reais são retráteis e têm mais conteúdo do que a bancada mostra"*.

  Hoje o espécime é o `index.html` num `<iframe>`, com o corpus servido, os widgets reais e o
  recolhimento real (`data-collapsed`, que é como o app já recolhe painel). A composição deixa de
  ser um desenho e passa a ser **um conjunto de OVERRIDES sobre o app**:

  - `HOJE` não aplica override nenhum. O controle é o app, literalmente.
  - as outras mexem em três coisas: a GRADE do `#hud`, quais widgets ficam recolhidos, e o que vira
    alça. Nada de conteúdo inventado.

  ⭑ **É isso que torna a medida comparável:** o mesmo DOM, o mesmo CSS, o mesmo corpus. A diferença
  entre duas leituras é a composição, e mais nada.

  ## ☠️ SÃO TRÊS GRANDEZAS, e trocá-las fabrica número plausível e falso

  | grandeza | a pergunta | quem responde |
  |---|---|---|
  | **ponteiro** | o gesto de órbita morre aqui? | `spatia.hud()`, dentro do app |
  | **tinta** | há superfície COBRINDO o céu aqui? | esta bancada |
  | **texto** | há glifo disputando o olho aqui? | esta bancada — e é a que COMPOSIÇÃO pede |

  ☠️ **`elementFromPoint` NÃO SERVE AQUI, e a bancada descobriu medindo.** Uma versão devolvia
  `left 0,0%` com quatro painéis desenhados: `#hud` declara `pointer-events: none`, e hit-test por
  definição PULA quem não recebe ponteiro. A ferramenta de INTERAÇÃO não responde pergunta de
  COMPOSIÇÃO. A saída é colher as caixas de LINHA com `Range.getClientRects()` e testar a grade
  contra elas — e são as caixas de linha, não a do elemento: um `<div>` de 230 px com a palavra
  "MASSA" não cobre 230 px de atenção.

  ☠️ **E os painéis dos trilhos NÃO PINTAM.** São texto com `text-shadow` sobre o céu; fundo opaco
  está refutado por escrito em `hud/yield.js`. Medir só tinta responde ~zero justamente sobre o que
  se quer discutir.

  ⚠️ **Nenhuma das três mede ATENÇÃO.** Contraste, movimento e tipografia decidem para onde o olho
  vai. É o piso MEDIDO da conversa — que é mais do que "aproximadamente 25%" tem.
-->
<style>
  :root { --barra: 30px; }
  html, body { margin: 0; height: 100%; background: #05070c; overflow: hidden;
               font: 11px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: #c9b48d; }
  /*
   * O espécime ocupa tudo menos a barra. Ele ENCOLHE em vez de ser coberto: barra por cima cortava
   * o prompt ao meio, e rodapé cortado não se julga. `medir()` usa a MESMA caixa (`clientHeight`).
   */
  /*
   * ☠️ **ALTURA EXPLÍCITA, e não `top`+`bottom`.** `<iframe>` é elemento SUBSTITUÍDO: com
   * `height: auto`, ancorar topo e base não o estica — ele fica nos 150 px intrínsecos do padrão.
   * A bancada mediu uma faixa de 150 px de altura e devolveu percentuais com cara de medida.
   */
  #app { position: fixed; left: 0; top: 0; width: 100vw; height: calc(100vh - var(--barra)); border: 0; }
  #grade-canvas { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
  #barra {
    position: fixed; z-index: 70; left: 0; right: 0; bottom: 0; height: var(--barra);
    display: flex; gap: 10px; align-items: center; padding: 0 12px; flex-wrap: nowrap; overflow: hidden;
    background: rgba(6, 9, 15, 0.96); border-top: 1px solid rgba(200, 150, 80, 0.28);
  }
  #barra button {
    background: transparent; color: #c9b48d; border: 1px solid rgba(200, 150, 80, 0.4);
    padding: 2px 9px; cursor: pointer; font: inherit; letter-spacing: 0.12em; text-transform: uppercase;
  }
  #barra button[aria-pressed="true"] { background: rgba(200, 150, 80, 0.18); color: #f0dcb4; border-color: #c8964e; }
  #botoes { display: flex; gap: 6px; flex: 0 0 auto; }
  #leitura { margin-left: auto; display: flex; gap: 10px; white-space: nowrap; font-size: 10px; }
  #leitura b { color: #f0dcb4; }
  /*
   * O `watch` fica RECOLHIDO. Aberto, ele cobria o trilho direito do espécime — a bancada tapando
   * o que existe para mostrar. Ele nunca entra na medida: `medir()` percorre o `#hud` do iframe.
   */
  #vigia { position: fixed; z-index: 71; right: 12px; bottom: calc(var(--barra) + 6px); max-width: 58ch; }
  #vigia summary { list-style: none; cursor: pointer; color: #d8b070; letter-spacing: .14em; text-align: right;
                   padding: 3px 8px; background: rgba(6,9,15,.9); border: 1px solid rgba(200,150,80,.28); }
  #vigia summary::-webkit-details-marker { display: none; }
  #vigia .corpo { padding: 8px 10px; background: rgba(6,9,15,.94); border: 1px solid rgba(200,150,80,.22);
                  border-top: 0; color: #8e7c5c; font-size: 10px; line-height: 1.6; }
  /*
   * O INVENTÁRIO POR ROTA — ele cobre o espécime de propósito: é uma leitura de CONJUNTO, e nesse
   * momento não se está julgando pixel nenhum. Fecha com ESC ou no botão.
   */
  #tabela {
    position: fixed; z-index: 75; inset: 20px 20px calc(var(--barra) + 12px) 20px; overflow: auto;
    background: rgba(6, 9, 15, 0.985); border: 1px solid rgba(200, 150, 80, 0.35); padding: 14px 16px;
  }
  #tabela table { border-collapse: collapse; width: 100%; font-size: 10px; }
  #tabela th, #tabela td { text-align: left; padding: 3px 8px; border-bottom: 1px solid rgba(200,150,80,.12); vertical-align: top; }
  #tabela th { color: #d8b070; letter-spacing: .14em; font-weight: 500; position: sticky; top: -14px; background: #06090f; }
  #tabela td.n { text-align: right; color: #f0dcb4; }
  #tabela caption { text-align: left; color: #c9b48d; padding-bottom: 8px; letter-spacing: .1em; }
  #tabela .nota { color: #8e7c5c; margin-top: 10px; line-height: 1.7; }
  #estado { position: fixed; inset: 0; z-index: 80; display: grid; place-content: center; text-align: center;
            background: #05070c; color: #8e7c5c; padding: 40px; line-height: 1.9; }
  #estado.erro { background: #1a0606; color: #ff9a9a; }
</style>
</head>
<body>
<iframe id="app" src="./index.html"></iframe>
<canvas id="grade-canvas"></canvas>
<div id="estado">montando o app de verdade…</div>
<details id="vigia"><summary></summary><div class="corpo"></div></details>
<div id="tabela" hidden></div>
<div id="barra">
  <span style="letter-spacing:.2em">COMPOSIÇÃO</span>
  <span id="botoes"></span>
  <button id="grade" aria-pressed="false">ver a grade</button>
  <button id="rotas">inventariar rotas</button>
  <span id="leitura"></span>
</div>

<script type="module">
const estado = document.getElementById('estado');
const dizer = (t, ehErro = false) => {
  estado.textContent = t; estado.classList.toggle('erro', ehErro); estado.style.display = 'grid';
  if (ehErro) throw new Error(t);
};
const espera = (ms) => new Promise((r) => setTimeout(r, ms));

/*
 * ─────────────────────────────────────────── subir o app e tirar a tela de boot da frente
 *
 * ⚠️ **IGNORAR é obrigatório depois de todo carregamento** — a tela de boot fica por cima e as
 * sondas devolvem `null`. É a mesma armadilha que o handoff registra para medir o app à mão.
 */
const quadro = document.getElementById('app');
await new Promise((r) => quadro.addEventListener('load', r, { once: true }));
const doc = quadro.contentDocument;
const win = quadro.contentWindow;

let tentativas = 0;
while (tentativas++ < 80) {
  const btn = [...doc.querySelectorAll('button, [role=button]')].find((b) => /IGNORAR/i.test(b.textContent || ''));
  if (btn) { btn.click(); break; }
  await espera(250);
}
tentativas = 0;
while (!win.spatia && tentativas++ < 80) await espera(250);
if (!win.spatia) dizer('o app subiu sem `window.spatia` — a bancada não tem o que medir.', true);
await espera(1000);

const hud = doc.getElementById('hud');
if (!hud) dizer('não achei `#hud` dentro do app — a casca da HUD mudou de nome.', true);

/*
 * ─────────────────────────────────────────── o inventário REAL dos painéis
 *
 * Nada aqui é escrito à mão: os widgets, os títulos e o conteúdo são os do app. A bancada só sabe
 * ONDE eles estão e se estão recolhidos — que é exatamente o que uma composição decide.
 */
const widgetsDe = (fenda) => [...doc.querySelectorAll(`[data-slot="${fenda}"] .widget`)];
const inventario = () => ['left', 'right', 'stage', 'strip'].map((f) => {
  const ws = widgetsDe(f);
  const rec = ws.filter((w) => w.getAttribute('data-collapsed') === 'true').length;
  return `${f} ${ws.length}${ws.length ? ` (${rec} recolhidos)` : ''}`;
}).join(' · ');

/** Recolhe ou abre um painel REAL, pelo mesmo atributo que o acordeão do app usa. */
const recolher = (w, sim) => w.setAttribute('data-collapsed', String(sim));

/** A alça: coluna estreita com o nome da fenda, para o trilho recolhido não sumir sem rastro. */
const alca = (texto, direita = false) => {
  const n = doc.createElement('div');
  n.dataset.bancadaAlca = '1';
  n.textContent = texto;
  n.style.cssText = 'writing-mode:vertical-rl;display:flex;align-items:center;justify-content:center;'
    + 'height:100%;font-size:11px;letter-spacing:.2em;color:#8e7c5c;cursor:pointer;'
    + (direita ? 'transform:rotate(180deg);' : '');
  return n;
};

// ─────────────────────────────────────────── as composições, como OVERRIDES sobre o app
const COMPOSICOES = [
  {
    id: 'hoje',
    titulo: 'HOJE',
    porque: 'o app, sem override nenhum. É o controle porque É a tela — não uma reconstrução dela.',
    watch: [
      'quantos centros de atenção competem ao mesmo tempo?',
      'o documento em foco é o maior elemento da tela, ou perde para os trilhos?',
      '⚠️ o recolhido é do OPERADOR e PERSISTE (`espatial.collapsed.v1`) — o controle varia com quem usou a máquina por último',
    ],
    aplicar: () => {},
  },
  {
    id: 'explore',
    titulo: 'EXPLORE',
    porque: 'navegar. Os dois trilhos recolhem de verdade e viram alça; o universo fica com a tela.',
    watch: [
      'a alça continua ACHÁVEL, ou o trilho some sem deixar rastro?',
      '☠️ recolher NÃO é desmontar — os widgets seguem montados, e `spatia.hud().widgets` prova',
      'sobra céu suficiente para o gesto de órbita ter para onde ir?',
    ],
    aplicar: ({ left, right }) => {
      hud.style.gridTemplateColumns = '30px 1fr 30px';
      for (const w of [...widgetsDe('left'), ...widgetsDe('right')]) { recolher(w, true); w.style.display = 'none'; }
      left.append(alca('◀ ÁRVORE'));
      right.append(alca('CONTEXTO ▶', true));
    },
  },
  {
    id: 'focus',
    titulo: 'FOCUS',
    porque: 'ler. A GRADE muda — o trilho esquerdo vira alça, o direito emagrece — e o conteúdo ocupa o que sobra.',
    watch: [
      '☠️ largura não se força contra a grade: painel com `width` fixa numa coluna estreita TRANSBORDA e come o trilho vizinho',
      'o contexto magro ainda responde "que corpo é este", ou virou enfeite?',
      'o documento tem âncora visual com o astro, ou continua flutuando sem dono?',
    ],
    aplicar: ({ left }) => {
      hud.style.gridTemplateColumns = '30px 1fr minmax(200px, 16vw)';
      for (const w of widgetsDe('left')) { recolher(w, true); w.style.display = 'none'; }
      left.append(alca('◀ ÁRVORE'));
      /*
       * ⚠️ **O trilho direito RECOLHE o que não é identidade, em vez de sumir.** QUAL painel fica é
       * decisão de produto (T-71); a bancada mostra a consequência de uma escolha, e o `watch` diz
       * que ela é escolha.
       */
      for (const w of widgetsDe('right')) recolher(w, !/CONTEXTO/i.test(w.textContent || ''));
    },
  },
  {
    id: 'inspect',
    titulo: 'INSPECT',
    porque: 'inspecionar. Os dois trilhos voltam inteiros e TODOS os painéis abrem — o teto do que a tela mostra.',
    watch: [
      'com tudo aberto, ainda sobra céu? (se não, INSPECT é HOJE com outro nome)',
      'a leitura do inspector tem hierarquia, ou tudo pesa igual?',
      '⚠️ o acordeão do app recolhe os IRMÃOS ao abrir um (`kernel/widgets.js`) — tudo aberto é um estado que o gesto normal não produz',
    ],
    aplicar: () => {
      for (const w of doc.querySelectorAll('#hud .widget')) recolher(w, false);
    },
  },
];

// ─────────────────────────────────────────── a medida, dentro do documento do app
const PASSO = 12;

function caixasDeTexto(raiz) {
  const saida = [];
  const passeio = doc.createTreeWalker(raiz, win.NodeFilter.SHOW_TEXT);
  for (let no = passeio.nextNode(); no; no = passeio.nextNode()) {
    if (!no.textContent.trim()) continue;
    const pai = no.parentElement;
    if (!pai) continue;
    const s = win.getComputedStyle(pai);
    if (s.display === 'none' || s.visibility === 'hidden' || parseFloat(s.opacity) === 0) continue;
    const fenda = pai.closest('[data-slot]')?.dataset.slot ?? (pai.closest('#hud header') ? 'header' : 'fora');
    const r = doc.createRange();
    r.selectNodeContents(no);
    for (const c of r.getClientRects()) if (c.width > 0 && c.height > 0) saida.push({ c, fenda });
  }
  return saida;
}

function caixasDeTinta(raiz) {
  const saida = [];
  for (const n of raiz.querySelectorAll('*')) {
    const s = win.getComputedStyle(n);
    if (s.display === 'none' || s.visibility === 'hidden' || parseFloat(s.opacity) === 0) continue;
    const bg = s.backgroundColor;
    const opaco = bg && bg !== 'transparent' && !/rgba\(\s*0,\s*0,\s*0,\s*0\s*\)/.test(bg);
    const borda = parseFloat(s.borderTopWidth) > 0 || parseFloat(s.borderLeftWidth) > 0;
    if (!opaco && !borda && s.backgroundImage === 'none') continue;
    const c = n.getBoundingClientRect();
    if (c.width > 0 && c.height > 0) saida.push({ c });
  }
  return saida;
}

const dentro = (c, x, y) => x >= c.left && x < c.right && y >= c.top && y < c.bottom;

function medir(mostrarGrade) {
  const cv = document.getElementById('grade-canvas');
  const dpr = devicePixelRatio || 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr;
  cv.style.width = `${innerWidth}px`; cv.style.height = `${innerHeight}px`;
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, innerWidth, innerHeight);

  const textos = caixasDeTexto(hud);
  const tintas = caixasDeTinta(hud);
  const W = quadro.clientWidth;
  const H = quadro.clientHeight;   // a caixa do espécime, que já exclui a barra
  const porFenda = new Map();
  let pontos = 0, comTinta = 0, comTexto = 0, limpo = 0;
  for (let y = PASSO / 2; y < H; y += PASSO) {
    for (let x = PASSO / 2; x < W; x += PASSO) {
      pontos++;
      let fenda = null;
      for (const t of textos) if (dentro(t.c, x, y)) { fenda = t.fenda; break; }
      const temTexto = fenda !== null;
      let temTinta = false;
      if (!temTexto) for (const t of tintas) if (dentro(t.c, x, y)) { temTinta = true; break; }
      if (temTexto) { comTexto++; porFenda.set(fenda, (porFenda.get(fenda) || 0) + 1); }
      if (temTinta) comTinta++;
      if (!temTexto && !temTinta) limpo++;
      if (mostrarGrade) {
        g.fillStyle = temTexto ? '#e0a35a' : temTinta ? '#7aa2d0' : 'rgba(120,140,180,.16)';
        g.fillRect(x - 1, y - 1, 2, 2);
      }
    }
  }
  const frac = (n) => `${((n / pontos) * 100).toFixed(1)}%`;
  return {
    pontos,
    texto: frac(comTexto),
    tinta: frac(comTinta),
    ceuLimpo: frac(limpo),
    textoLeft: frac(porFenda.get('left') || 0),
    textoRight: frac(porFenda.get('right') || 0),
    textoStage: frac(porFenda.get('stage') || 0),
    textoStrip: frac(porFenda.get('strip') || 0),
    textoHeader: frac(porFenda.get('header') || 0),
    /* ⚠️ A grandeza do PONTEIRO vem do app, do lado de lá — as três lado a lado, sem conversão. */
    ponteiro: win.spatia?.hud?.().ponteiro?.fracaoReivindicada ?? null,
  };
}

// ─────────────────────────────────────────── o INVENTÁRIO por rota
/*
 * ☠️ **O CENSO OFFLINE JÁ EXISTE, e este responde outra pergunta.** `scripts/lei-residentes.mjs` §5
 * conta, LENDO A FONTE, quantas rotas montam cada widget. Ele não sabe o que a tela faz com eles:
 * quantos chegam RECOLHIDOS, quanto texto cada rota põe no ar, quanto céu sobra. Isso só se mede
 * com o app montado, e é o que esta varredura faz — as duas leituras juntas são o inventário.
 *
 * ⚠️ **O RECOLHIDO É DO OPERADOR e PERSISTE** (`espatial.collapsed.v1`, e ele ATRAVESSA a rota).
 * Então a coluna "recolhidos" descreve ESTA máquina, não o app recém-instalado — e o acordeão
 * recolhe os irmãos ao abrir um, então o estado "todos abertos" nem é alcançável pelo gesto normal.
 * Por isso a varredura publica o número em vez de normalizá-lo: normalizar esconderia justamente a
 * variável que faz duas pessoas verem telas diferentes.
 */
const ROTAS = ['', ...(win.spatia ? [] : []), 'files', 'system', 'web', 'bridge', 'journal', 'metrics', 'security', 'activity', 'storage'];

/** O título que o operador lê em cada moldura — é assim que um painel se chama na tela. */
const tituloDe = (w) => (w.querySelector('h2, .label')?.textContent || '(sem título)').trim().slice(0, 28);

async function inventarioDeRotas() {
  restaurar();
  const linhas = [];
  const guardaHash = win.location.hash;
  for (const r of ROTAS) {
    win.location.hash = r ? `#/${r}` : '#/';
    await espera(700);
    const m = medir(false);
    const porFenda = {};
    for (const f of ['left', 'right', 'stage', 'strip']) {
      const ws = widgetsDe(f);
      porFenda[f] = {
        n: ws.length,
        recolhidos: ws.filter((w) => w.getAttribute('data-collapsed') === 'true').length,
        titulos: ws.map(tituloDe),
      };
    }
    const hudApp = win.spatia?.hud?.() ?? {};
    linhas.push({
      rota: r || 'raiz',
      montados: Object.values(porFenda).reduce((a, x) => a + x.n, 0),
      recolhidos: Object.values(porFenda).reduce((a, x) => a + x.recolhidos, 0),
      naoMontados: hudApp.widgets?.naoMontados?.length ?? null,
      ausentes: hudApp.widgets?.ausentes?.length ?? null,
      texto: m.texto, tinta: m.tinta, ceu: m.ceuLimpo,
      ponteiro: m.ponteiro == null ? '—' : `${(m.ponteiro * 100).toFixed(1)}%`,
      porFenda,
    });
  }
  win.location.hash = guardaHash;
  await espera(600);
  montar(atual);
  return linhas;
}

function desenharInventario(linhas) {
  const t = document.getElementById('tabela');
  const cel = (txt, cls) => { const n = document.createElement('td'); n.textContent = txt; if (cls) n.className = cls; return n; };
  const tabela = document.createElement('table');
  const cap = document.createElement('caption');
  cap.textContent = `INVENTÁRIO DA HUD POR ROTA — ${linhas.length} rotas · janela ${quadro.clientWidth}×${quadro.clientHeight}`;
  tabela.append(cap);
  const cab = document.createElement('tr');
  for (const h of ['rota', 'montados', 'recolhidos', 'não montados', 'ausentes', 'texto', 'tinta', 'céu limpo', 'ponteiro', 'painéis por fenda']) {
    const th = document.createElement('th'); th.textContent = h; cab.append(th);
  }
  tabela.append(cab);
  for (const l of linhas) {
    const tr = document.createElement('tr');
    const fendas = ['left', 'right', 'stage', 'strip']
      .filter((f) => l.porFenda[f].n)
      .map((f) => `${f}: ${l.porFenda[f].titulos.join(', ')}`).join('  ·  ');
    tr.append(cel(l.rota), cel(l.montados, 'n'), cel(l.recolhidos, 'n'), cel(l.naoMontados ?? '—', 'n'),
      cel(l.ausentes ?? '—', 'n'), cel(l.texto, 'n'), cel(l.tinta, 'n'), cel(l.ceu, 'n'), cel(l.ponteiro, 'n'), cel(fendas));
    tabela.append(tr);
  }
  const nota = document.createElement('div');
  nota.className = 'nota';
  nota.textContent = '⚠️ «recolhidos» é estado do OPERADOR e persiste entre rotas (espatial.collapsed.v1) — '
    + 'esta coluna descreve ESTA máquina. · «ausentes» é declarado-e-não-montado, e é DEFEITO (T-48). · '
    + 'texto/tinta/céu são desta bancada; ponteiro vem de spatia.hud(), do app. ESC fecha.';
  t.replaceChildren(tabela, nota);
  t.hidden = false;
}

document.getElementById('rotas').onclick = async (e) => {
  e.currentTarget.disabled = true;
  e.currentTarget.textContent = 'varrendo…';
  const linhas = await inventarioDeRotas();
  desenharInventario(linhas);
  window.bancada?.guardarInventario?.(linhas);
  e.currentTarget.disabled = false;
  e.currentTarget.textContent = 'inventariar rotas';
};
addEventListener('keydown', (ev) => { if (ev.key === 'Escape') document.getElementById('tabela').hidden = true; });

// ─────────────────────────────────────────── montagem e troca
/*
 * Trocar de composição RESTAURA o app antes de aplicar a próxima — override acumulado mede a soma
 * de duas composições e ninguém percebe. O estado original de cada painel é lido UMA vez.
 */
const original = new Map();
for (const w of doc.querySelectorAll('#hud .widget')) original.set(w, w.getAttribute('data-collapsed'));
const gradeOriginal = hud.style.gridTemplateColumns;

function restaurar() {
  hud.style.gridTemplateColumns = gradeOriginal;
  for (const [w, valor] of original) {
    w.style.display = '';
    if (valor === null) w.removeAttribute('data-collapsed');
    else w.setAttribute('data-collapsed', valor);
  }
  for (const n of doc.querySelectorAll('[data-bancada-alca]')) n.remove();
}

let atual = COMPOSICOES[0];
let verGrade = false;
const criar = (tag, props) => Object.assign(document.createElement(tag), props);

function montar(comp) {
  atual = comp;
  restaurar();
  comp.aplicar({
    left: doc.querySelector('[data-slot="left"]'),
    right: doc.querySelector('[data-slot="right"]'),
    stage: doc.querySelector('[data-slot="stage"]'),
    strip: doc.querySelector('[data-slot="strip"]'),
  });
  const vig = document.getElementById('vigia');
  vig.querySelector('summary').textContent = `▸ WATCH · ${comp.titulo}`;
  vig.querySelector('.corpo').replaceChildren(
    criar('div', { textContent: comp.porque, style: 'color:#c9b48d;margin-bottom:6px' }),
    criar('div', { textContent: `painéis reais: ${inventario()}`, style: 'color:#7aa2d0;margin-bottom:6px' }),
    ...comp.watch.map((w) => criar('div', { textContent: `· ${w}` })));
  for (const b of document.querySelectorAll('#botoes button')) b.setAttribute('aria-pressed', String(b.dataset.id === comp.id));
  // Dois quadros: medir antes de o layout assentar responde sobre uma tela que não existiu.
  requestAnimationFrame(() => requestAnimationFrame(() => {
    const m = medir(verGrade);
    document.getElementById('leitura').replaceChildren(
      criar('span', { textContent: 'texto ' }), criar('b', { textContent: m.texto }),
      criar('span', { textContent: '· tinta ' }), criar('b', { textContent: m.tinta }),
      criar('span', { textContent: '· céu limpo ' }), criar('b', { textContent: m.ceuLimpo }),
      criar('span', { textContent: `· texto: ⟵ ${m.textoLeft} · palco ${m.textoStage} · ${m.textoRight} ⟶`
        + ` · topo ${m.textoHeader} · ponteiro ${m.ponteiro == null ? '—' : (m.ponteiro * 100).toFixed(1) + '%'}`
        + ` · ${m.pontos} pts` }));
  }));
}

const botoes = document.getElementById('botoes');
for (const c of COMPOSICOES) {
  const b = criar('button', { textContent: c.titulo });
  b.dataset.id = c.id;
  b.onclick = () => montar(c);
  botoes.append(b);
}
document.getElementById('grade').onclick = (e) => {
  verGrade = !verGrade;
  e.currentTarget.setAttribute('aria-pressed', String(verGrade));
  montar(atual);
};
addEventListener('resize', () => montar(atual));

estado.style.display = 'none';
montar(atual);

/** A sonda da bancada. `bancada.medir()` devolve os mesmos números da barra. */
let ultimoInventario = null;
window.bancada = Object.freeze({
  composicoes: COMPOSICOES.map((c) => c.id),
  /** A varredura das rotas, como dado. `await bancada.rotas()` devolve a tabela inteira. */
  rotas: inventarioDeRotas,
  guardarInventario: (l) => { ultimoInventario = l; },
  ultimoInventario: () => ultimoInventario,
  ir: (id) => montar(COMPOSICOES.find((c) => c.id === id) || atual),
  medir: () => medir(false),
  inventario,
  atual: () => atual.id,
  app: () => win.spatia,
});
</script>
</body>
</html>
