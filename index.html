  .boot-actions { display: flex; gap: 12px; margin-top: 6px; flex-wrap: wrap; justify-content: center; }
  /*
    `flex: 0 0 auto` + `nowrap`: sem os dois, o container flex encolhe os filhos abaixo do
    conteúdo e o rótulo — que é longo e tem `letter-spacing` largo — quebra em três linhas e
    vaza para fora da própria borda. Foi exatamente o que aconteceu na primeira versão.
  */
  .boot-actions .btn { flex: 0 0 auto; white-space: nowrap; }

  @media (max-width: 900px) {
    #hud { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr auto; }
    aside { display: none; }
    .stage { grid-column: 1; }
  }
</style>
</head>
<body>

<canvas id="space"></canvas>

<div id="bodies"></div>

<div id="hud">
  <header>
    <!--
      Aqui havia logo e slogan. Identidade não muda, então não merece espaço permanente — e a
      aba do browser já diz o nome. O canto passa a mostrar o que precisa ser verdade em TODO
      app e que não aparecia em nenhum: idade do índice (a métrica que envelhece em silêncio),
      janela de uso e custo da sessão.
    -->
    <div class="headstat" data-headstat></div>

    <div class="status">
      <span class="status-state">
        <i class="dot" data-state-dot data-state="boot"></i>
        <span data-state-label>INICIANDO</span>
      </span>
      <span class="status-services" data-services></span>
      <!--
        CONTEXTO ATUAL — o que está travado, o que está aberto.

        É a informação que mais muda e que não existia em lugar nenhum da tela: o operador
        travava a câmera num astro e a única confirmação era a própria cena ter se mexido. Ela
        ocupa a faixa que os rótulos dos subsistemas liberaram, que é o mesmo espaço trocado
        por informação de taxa de mudança muito maior.

        Vazio por padrão, e vazio de propósito: sem contexto não há o que dizer, e preencher
        com "nenhum astro selecionado" seria gastar a faixa para afirmar uma ausência.
      -->
      <span class="status-context" data-context hidden></span>
    </div>

    <!--
      SYSTRAY — os itens de estado, imediatamente antes do relógio.

      A faixa do topo já ERA uma systray e ninguém a tratava como tal: identidade e estado
      residente à esquerda, o que o sistema está fazendo no centro, relógio à direita. É a
      mesma estrutura da barra do macOS, e o lugar de wifi/bateria é exatamente aqui — colado
      no relógio. Os cinco botões rotulados que moravam no rodapé eram *status items* fora de
      casa. Nenhuma barra nova, nenhum deslocamento do header: o que existe foi estendido.

      Um item de menu bar é GLIFO COMPACTO cujo desenho comunica o estado, e o clique abre um
      menu ancorado. É por isso que a barra do macOS acomoda oito itens no espaço em que cinco
      botões rotulados mal cabiam.

      ⚠️ Os `data-*-toggle` continuam sendo ESTES elementos, só que aqui dentro. Cinco módulos
      (`voice`, `terminal`, `speech-panel`, `permissions`, `controls`) os procuram por
      `querySelector` no boot — recriá-los em JS ao abrir o popover devolveria `null` para
      todos eles. Eles nascem no HTML, escondidos, e nenhum daqueles módulos precisou mudar.
    -->
    <!--
      Systray e relógio no MESMO agrupamento à direita.

      O header é `justify-content: space-between`; com quatro filhos soltos o espaço é repartido
      igualmente e a systray fica boiando no meio do vão, longe do relógio. Encostar um no outro
      não é ajuste fino: o agrupamento da direita é o que faz a barra ler como barra de menus —
      é ali que o macOS põe wifi, bateria e relógio, nessa ordem, colados.
    -->
    <div class="header-right">
    <!--
      O SWITCHER DE CENA. Ele fica FORA da systray de propósito: a systray é onde moram estados que
      se consultam (voz, permissões, relógio), e isto é uma troca de MUNDO. Segmentado, com os dois
      lados sempre visíveis, porque um toggle de um botão só esconde metade do que existe — e o
      usuário precisa saber que a outra cena existe antes de querer ir para ela.
    -->
    <div class="cena-switch" data-cena role="group" aria-label="cena">
      <button type="button" class="btn" data-variant="ghost" data-size="sm" data-cena-btn="agente" aria-pressed="true" title="o buraco negro no centro: como a IA pensa">AGENTE</button>
      <button type="button" class="btn" data-variant="ghost" data-size="sm" data-cena-btn="universo" aria-pressed="false" title="gravidade local, sem centro: onde o conhecimento vive">UNIVERSO</button>

      <div class="tray-item">
        <button type="button" class="btn" data-variant="icon" data-size="md" data-tray="web"

            <circle cx="12" cy="12" r="8"/>
            <path d="M4 12h16M12 4c2.5 2.6 2.5 12.4 0 16M12 4c-2.5 2.6-2.5 12.4 0 16"/>

          <!--
            FUNDO não abre painel: ele NAVEGA para a seção da página de configuração. Os outros
            dois são painéis flutuantes porque se mexe neles olhando a cena; este mostra três
            imagens e o crédito exigido pela licença, que não cabem num popover de 200px.
          -->
          <button type="button" class="btn" data-variant="outline" data-size="sm" data-backdrop-open>FUNDO</button>
          <!--
            A JANELA DO TEMPO deixa de estar sempre visível. Ela não é monitoramento — é um
            controle que se usa em rajadas, ao investigar um período, e ficava ocupando uma
            faixa permanente do trilho para exibir uma data.

            O botão reaproveita o recolher que TODA seção agora tem, em vez de inventar um
            segundo mecanismo de mostrar/esconder: dois caminhos para o mesmo estado divergem
            no primeiro que alguém esquecer de atualizar.
          -->
          <button type="button" class="btn" data-variant="outline" data-size="sm" data-time-toggle>JANELA DO TEMPO</button>

  <aside class="slot" data-slot="left"></aside>
  <div class="stage slot keep-cinematic" data-slot="stage"></div>

  <nav class="dock" data-dock></nav>

  <footer class="keep-cinematic">
    <div class="attachments" data-attachments></div>
    <div class="prompt-line">
      <!--
        O COMPOSITOR: tudo que participa de escrever uma pergunta mora dentro dele — caret,
        campo, anexo e o botão de ação. Anexo e mic eram irmãos no grid, ao lado dos toggles de
        configuração, e liam como se fossem mais dois toggles. Fechá-los na mesma moldura do
        campo é o que faz o olho entender que pertencem ao ato de compor, não ao de configurar.
      -->
      <div class="composer">
        <span class="prompt-caret">›</span>
        <span class="prompt-wrap">
          <input data-prompt autocomplete="off" spellcheck="false" aria-label="pergunta ao núcleo">
          <span class="prompt-ghost" data-prompt-ghost>faça uma pergunta ao núcleo</span>
        </span>

        <input type="file" data-attach-input multiple hidden
               accept="image/*,audio/*,video/*,.pdf,.txt,.md,.json,.csv,.log,.py,.js,.ts,.yaml,.yml">
        <button type="button" class="btn" data-variant="icon" data-size="md" data-on="false" data-attach-btn title="anexar arquivo, imagem ou áudio">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 6.5l-6 6a2.5 2.5 0 003.5 3.5l6-6a4 4 0 00-5.7-5.7l-6.5 6.5a5.5 5.5 0 007.8 7.8l5-5"/></svg>
        </button>

        <!--
          Um botão, três papéis: mic sem texto, enviar com texto, parar gravando.
          O modo é derivado do estado (input + reconhecimento), nunca guardado — estado
          duplicado entre o que o botão mostra e o que ele faz é como o botão passa a mentir.
        -->
        <button type="button" class="btn" data-variant="icon" data-size="md" data-emphasis="primary" data-on="false" data-send-btn data-mode="mic" title="falar">
          <svg class="ico-mic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a3 3 0 013 3v5a3 3 0 01-6 0V6a3 3 0 013-3z"/><path d="M6 11a6 6 0 0012 0M12 17v4"/></svg>
          <!-- Ponta em x=20 (direita). A versão anterior começava em `M4 12` e ia até x=20,
               ou seja, ponta à ESQUERDA — um "enviar" apontando para trás. -->
          <svg class="ico-send" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12L4 4l6 8-6 8z"/></svg>
          <svg class="ico-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="1"/></svg>
        </button>
      </div>

      <canvas class="waveform" data-waveform></canvas>

      <!--
        Os cinco botões de configuração saíram daqui para a systray do topo (ver o `data-systray`
        no header). Eles nunca foram parte de compor uma pergunta: eram estado do sistema
        estacionado ao lado do campo de texto, e a proximidade fazia o olho lê-los como parte do
        compositor. O rodapé fica só com o que serve a escrever.
      -->
    </div>
    <!--
      A linha de dicas fixa saiu junto: ela dizia "` AFINAR · P PERMISSÕES · V CONFIG VOZ …"
      escrito à mão, e já apodreceu uma vez anunciando uma tecla que tinha mudado. `keys.hints()`
      existe justamente para montar essa lista a partir dos atalhos REGISTRADOS — e é isso que a
      seção ATALHOS da página de configuração vai consumir (itens 4 e 5 da fila).

      O que fica é a dica de VOZ, que é retorno dinâmico do microfone e não lista de atalho.
      O espaço liberado é ganho: não preencher sem pedido.
    -->
    <div class="footer-hints">
      <span data-voice-hint></span>
    </div>
  </footer>

  <div class="inspector" data-inspector>
    <div class="label">
      <span data-inspector-title>—</span>
      <button class="inspector-close" data-inspector-close aria-label="fechar">×</button>

  Eles nascem aqui e são movidos para a fenda do widget na montagem; ao desmontar, voltam.

<div id="boot">
  <!--
    ⚠️ A GRAFIA É `SpatIA`, com IA em maiúsculo, e ela NÃO é estilo — é o que faz o componente de
    Inteligência Artificial aparecer no nome. `SPATIA` em versalete perderia exatamente isso, que é
    a razão de a identidade escolher essa forma. Ver `docs/README.md`.
  -->
  <h1 class="marca">SpatIA</h1>
  <span class="sub">The Spatial Operating System for AI</span>
  <div class="boot-log" data-boot-log></div>
  <div class="boot-status" data-boot-status>verificando subsistemas…</div>
  <!--
    Os dois botões do gate (ATIVAR O SOM AMBIENTE · IGNORAR) são criados em `hud/boot.js`, não
    aqui: eles só existem depois de o diagnóstico terminar, e marcá-los no HTML os faria piscar
    na tela durante a checagem, oferecendo uma escolha antes de haver o que escolher.

    Histórico, para não refazer a volta: o botão ENGATAR original ficava aqui e foi removido
    porque perguntava "posso entrar?" — pergunta de uma resposta só. O gate atual pergunta sobre
    o SOM, que é a única coisa desta tela que o browser não deixa o sistema decidir sozinho.
  -->
</div>

<!--
  Guarda de último recurso do boot — clássico, NÃO módulo, e ANTES do módulo de propósito.

  O modo de falha que ela existe para matar: um erro de sintaxe ou um import quebrado em
  QUALQUER arquivo do grafo de módulos impede o `main.js` inteiro de executar. Nenhum
  try/catch dentro do `main.js` alcança isso — ele nunca roda. O resultado na tela é a pior
  falha possível: "verificando subsistemas…" para sempre, sem uma palavra sobre a causa, com
  o motivo real visível só no console. Uma tela de boot que não sabe dizer que o boot falhou
  é pior que não ter tela de boot.

  `capture: true` porque erro de CARREGAMENTO de recurso não borbulha — ele só existe na fase
  de captura, no elemento que falhou.
-->
<script>
  (function () {
    var reported = false;
    function report(reason) {
      if (reported) return;
      var status = document.querySelector('[data-boot-status]');
      // Boot já concluído: o elemento saiu de cena e não há nada a informar aqui. Um erro
      // depois da entrada é assunto do log da sessão, não da tela de partida.
      if (!status) return;
      reported = true;
      status.textContent = reason;
      status.style.color = 'var(--bad)';
    }
    window.addEventListener(
      'error',
      function (event) {
        var target = event.target;
        if (target && target !== window && target.tagName === 'SCRIPT') {
          report('módulo não carregou: ' + (target.src || 'origem desconhecida'));
          return;
        }
        report('falha ao iniciar: ' + (event.message || 'erro desconhecido'));
      },
      true
    );
    window.addEventListener('unhandledrejection', function (event) {
      var reason = event.reason;
      report('falha ao iniciar: ' + ((reason && reason.message) || reason || 'promessa rejeitada'));
    });
  })();
</script>
<script type="module" src="/src/main.js"></script>
