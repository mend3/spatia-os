<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>espatial-os · bancada 3D</title>

<!-- Mesmo motivo do index.html: 404 permanente no console treina a ignorar o console. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%23040608'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='4.5' fill='none' stroke='%23ffb35c' stroke-width='2.5'/%3E%3C/svg%3E">

<!--
  BANCADA — um objeto da cena por vez, isolado, parado e medível.

  Não é demo nem vitrine. Ela existe porque revisar um shader dentro da cena completa é
  medir a coisa errada: 468 estrelas em órbita, um disco girando, bloom e lente por cima, e
  tudo se movendo entre um quadro e o seguinte. Nesta sessão isso custou caro de forma
  concreta — a extinção do anel ficou sem validação porque um A/B de dois screenshots
  comparou astros diferentes numa cena que tinha andado no intervalo.

  As três decisões que fazem dela uma bancada e não uma segunda cena:

  1. O TEMPO É MANUAL. Nada anima sozinho; um slider move o relógio. Comparar duas versões de
     um shader exige o MESMO instante nas duas, e "mesmo instante" não existe num loop livre.
  2. UM OBJETO POR VEZ, sobre fundo liso. Sem pós-processamento, sem vizinho aditivo somando
     brilho por cima. O que se vê é o que aquele material desenha.
  3. IMPORTA OS MÓDULOS REAIS, não cópias. `space/rings.js`, `space/blackhole.js` e os outros
     entram por `import` do mesmo arquivo que a cena usa. Uma bancada que reimplementa o
     objeto para exibi-lo mente na primeira divergência, e é exatamente quando ela seria útil.
-->
<script type="importmap">
{ "imports": { "three": "/vendor/three.module.js" } }
</script>

<style>
  :root {
    --void: #04060a; --amber: #ffb35c; --amber-dim: #b8763a;
    --ink: #e8dfd2; --ink-dim: #7d8797; --ink-faint: #4a5261;
    --line: rgba(255, 179, 92, 0.16); --bad: #ff6b52;
    --hud-font: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--void); color: var(--ink);
               font-family: var(--hud-font); font-size: 11px; letter-spacing: 0.06em;
               overflow: hidden; -webkit-font-smoothing: antialiased; }

  /*
    `width/height: 100%` é obrigatório, não estilo.

    Canvas é elemento SUBSTITUÍDO: com largura automática ele se desenha no tamanho INTRÍNSECO,
    que é o do buffer — e o buffer tem `devicePixelRatio` embutido. Sem estas duas linhas o
    canvas saiu com 3024×1484 CSS numa janela de 1512×742, o dobro, e o objeto centrado no
    buffer apareceu no canto inferior direito da parte visível.
  */
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  .rail {
    position: fixed; top: 0; left: 0; bottom: 0; width: 268px; padding: 16px 14px;
    background: linear-gradient(90deg, rgba(4,6,10,0.96), rgba(4,6,10,0.86));
    border-right: 1px solid var(--line); overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: var(--amber-dim) transparent;
    display: flex; flex-direction: column; gap: 4px;
  }
  .rail > * { flex: 0 0 auto; }

  h1 { color: var(--amber); font-size: 10px; letter-spacing: 0.34em; font-weight: 400; }
  .sub { color: var(--ink-faint); font-size: 8px; letter-spacing: 0.2em; line-height: 1.6;
         margin-bottom: 10px; }
  .group { color: var(--ink-faint); font-size: 8px; letter-spacing: 0.3em;
           margin: 14px 0 6px; border-top: 1px solid var(--line); padding-top: 8px; }

  button {
    font: inherit; background: none; cursor: pointer; text-align: left;
    border: 1px solid var(--line); color: var(--ink-dim);
    padding: 5px 9px; font-size: 8.5px; letter-spacing: 0.2em;
    transition: color 160ms ease, border-color 160ms ease;
  }
  button:hover { color: var(--amber); border-color: var(--amber-dim); }
  button[aria-pressed="true"] { color: var(--void); background: var(--amber); border-color: var(--amber); }

  label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; align-items: baseline;
          padding: 3px 0; }
  label span { color: var(--ink-dim); font-size: 8px; letter-spacing: 0.16em; }
  label b { color: var(--ink); font-weight: 400; font-size: 9px;
            font-variant-numeric: tabular-nums; }
  input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--amber); height: 10px; }
  input[type=checkbox] { accent-color: var(--amber); }

  .note { color: var(--ink-faint); font-size: 7.5px; letter-spacing: 0.14em; line-height: 1.6;
          margin-top: 4px; }
  .readout { position: fixed; right: 14px; top: 14px; text-align: right;
             color: var(--ink-faint); font-size: 8px; letter-spacing: 0.18em; line-height: 1.7; }
  .readout b { color: var(--amber); font-weight: 400; }
  .fail { color: var(--bad); font-size: 9px; line-height: 1.6; padding: 10px 0; }
</style>
</head>
<body>

<canvas id="stage"></canvas>
<aside class="rail" id="rail"></aside>
<div class="readout" id="readout"></div>

<!-- A mesma guarda do index.html: erro de import não pode virar tela preta silenciosa. -->
<script>
  window.addEventListener('error', function (event) {
    var alvo = event.target;
    var rail = document.getElementById('rail');
    if (!rail || rail.dataset.failed) return;
    rail.dataset.failed = '1';
    rail.innerHTML =
      '<div class="fail">falha ao carregar: ' +
      (alvo && alvo !== window && alvo.tagName === 'SCRIPT'
        ? 'módulo ' + (alvo.src || '?')
        : event.message || 'erro desconhecido') +
      '</div>';
  }, true);
</script>
<script type="module" src="/src/sandbox/main.js"></script>
</body>
</html>
