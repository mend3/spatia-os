<script type="importmap">

<style>
  /*
    HUD militar: monoespaçado pequeno, hairlines de 1px, muito vazio.
    Sem card, sem borda-caixa, sem sombra. O que separa seção é espaço.
    A paleta é âmbar quente sobre preto — a mesma do disco de acreção, para que a
    interface pareça iluminada pelo núcleo em vez de sobreposta a ele.
  */
  /*
    QUATRO NÍVEIS DE ATENÇÃO — e a régua não é opinião, é medida.

    A tinta da HUD ocupa 8,4% dos pixels da tela (amostragem de 4px sobre as folhas visíveis do
    `#hud`), com 30px de margem em todos os lados e 60% da largura central livre. Ou seja: a
    sensação de tela cheia NÃO vinha de quantidade. Vinha de todo elemento ter o mesmo peso —
    rótulo de seção, valor, unidade e ornamento disputando a mesma atenção, com uma rampa de
    cinzas curta demais para separá-los.

    Por isso a correção é rampa e atribuição, não corte. Esconder metade da informação em hover
    devolveria ~4% de pixel e cobraria caro: dado que exige gesto para aparecer deixa de ser
    monitorado, e num painel de missão o valor de "carga cognitiva" e "custo" é serem vistos SEM
    pedir.

    | Nível | Quem | Token |
    |---|---|---|
    | 1 | pergunta, resposta, valor em foco | `--ink` |
    | 2 | corpus, timeline, memória — o dado | `--ink-dim` |
    | 3 | rótulo de seção, unidade, estado auxiliar | `--ink-faint`, `--amber-faint` |
    | 4 | linhas, grades, ornamento | `--line` |

    ⚠️ O ÂMBAR DEIXOU DE SER COR DE RÓTULO. Ele é a cor mais alta da paleta e estava em todo
    cabeçalho de seção, o que punha a mobília no nível 1 e o dado no 2 — hierarquia invertida.
    Agora `--amber` cheio é reservado ao FOCO (cursor do prompt, item selecionado, playhead) e os
    rótulos usam `--amber-faint`, que mantém a identidade sem competir com o que se lê.
  */
  :root {
    --void: #04060a;
    --amber: #ffb35c;
    --amber-dim: #b8763a;
    /* Identidade do rótulo sem o peso dele: mesma matiz, um nível abaixo. */
    --amber-faint: rgba(255, 179, 92, 0.44);
    /* A rampa foi ABERTA: os três cinzas estavam próximos demais para significar coisas
       diferentes. Contraste entre 1 e 2 subiu, e entre 2 e 3 também. */
    --ink: #f4efe6;
    --ink-dim: #9aa4b4;
    --ink-faint: #4a5261;
    --line: rgba(255, 179, 92, 0.075);
    --good: #6ee7a0;
    --bad: #ff6b52;
    --busy: #ffd257;
    --hud-font: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    /*
      RESPIRO. Era `clamp(14px, 2vw, 34px)` — 30px numa janela de 1512px, ou 2%. Com todo
      elemento encostado no limite, a tela lê como MOLDURA: um quadro pesado em volta de um
      centro vazio. A margem sobe para ~3,5% da largura, que é o que deixa o espaço fazer parte
      da interface em vez de ser o que sobra dela.
    */
    --gutter: clamp(24px, 3.4vw, 72px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--void);
    color: var(--ink);
    font-family: var(--hud-font);
    font-size: 11px;
    letter-spacing: 0.06em;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  #space { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }

  /* A HUD não intercepta o mouse: arrastar a câmera tem que funcionar em qualquer lugar.
     Só os controles reais reativam ponteiro. */
  #hud {
    position: fixed;
    inset: 0;
    display: grid;
    grid-template-columns: minmax(230px, 20vw) 1fr minmax(230px, 20vw);
    grid-template-rows: auto 1fr auto;
    padding: var(--gutter);
    gap: clamp(10px, 1.4vh, 22px) var(--gutter);
    pointer-events: none;
    transition: opacity 900ms ease;
  }
  #hud a, #hud button, #hud input, #hud .clickable { pointer-events: auto; }

  /*
    Sombra dura de 1px atrás de todo texto da HUD.
    É o que sustenta a legibilidade sobre uma nebulosa clara SEM precisar de fundo — custa zero
    layout e funciona igual em qualquer imagem que esteja rodando por trás.
  */
  #hud { text-shadow: 0 1px 3px rgba(4, 6, 10, 0.95), 0 0 8px rgba(4, 6, 10, 0.7); }

  /* Modo cinematográfico: TAB apaga tudo, sobra o núcleo, a voz e o texto. */
  body.cinematic #hud > *:not(.keep-cinematic) { opacity: 0; }
  body.cinematic #hud { gap: 0; }

  h1, h2 { font-size: 11px; font-weight: 500; letter-spacing: 0.24em; }

  .label {
    /* Nível 3: o rótulo é mobília — lido uma vez, depois é referência espacial. O dado abaixo
       dele é que precisa do contraste. */
    color: var(--amber-faint);
    font-size: 9px;
    letter-spacing: 0.3em;
    padding-bottom: 5px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 9px;
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }
  .label i { font-style: normal; color: var(--ink-faint); }
  /*
    O rótulo virou `<button>`: zera o estilo de agente e devolve a aparência que ele já tinha.

    ⚠️ `gap` e `nowrap` não são cosmética. Sem eles o título e a dica encostam e quebram em duas
    linhas nos trilhos estreitos — "MEMÓRIA RECUPERADA VETORIAL" virava duas linhas e a seção
    recolhida ficava mais alta que aberta, que é o oposto do que recolher promete.
  */
  .label { width: 100%; background: none; font: inherit; cursor: pointer; text-align: left;
           border-left: 0; border-right: 0; border-top: 0;
           gap: 10px; align-items: baseline; }
  .label .widget-title { white-space: nowrap; }
  /* A dica cede primeiro: ela é nível 3 e o título é a identidade da seção. */
  .label i { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .label:hover .widget-title { color: var(--amber); }
  /*
    A seta é o ÚNICO ornamento novo, e ela existe porque um título clicável sem sinal nenhum
    é um clique que ninguém descobre. Nível 4: presente, quase invisível.
  */
  .label::after { content: '▾'; color: var(--ink-faint); font-size: 8px; margin-left: 6px;
                  transition: transform 180ms ease; }
  .widget[data-collapsed="true"] > .label::after { transform: rotate(-90deg); }
  .widget[data-collapsed="true"] > .widget-body { display: none; }
  .widget[data-collapsed="true"] > .label { margin-bottom: 0; }

  /* ---------------- topo ---------------- */

  header { grid-column: 1 / -1; display: flex; align-items: flex-start; justify-content: space-between; gap: 20px; }

  /* Micro-grid de estado residente: dois pares por linha, valor em destaque. */
  .headstat { display: grid; grid-template-columns: repeat(2, auto auto); gap: 2px 9px;
              align-items: baseline; }
  .hs-label { color: var(--ink-faint); font-size: 7.5px; letter-spacing: 0.2em; }
  .hs-value { color: var(--ink); font-size: 11px; font-variant-numeric: tabular-nums;
              letter-spacing: 0.04em; }
  .hs-value[data-tone="warn"] { color: var(--busy); }
  .hs-value[data-tone="bad"] { color: var(--bad); }
  .hs-value[data-tone="good"] { color: var(--good); }

  .status { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; justify-content: center; }
  .status-state { display: flex; align-items: center; gap: 7px; color: var(--amber); letter-spacing: 0.26em; }

  /*
    O contêiner dos indicadores precisa ser flex por conta própria.
    O `gap` do `.status` separa os dois blocos (estado | serviços), não os itens DENTRO do
    segundo — e um `<span>` inline empilha os `.svc` sem folga nenhuma, deixando o ponto de
    um serviço colado no rótulo do anterior.
  */
  .status-services { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
  .status-context {
    display: flex; align-items: baseline; gap: 8px; min-width: 0;
    color: var(--ink); font-size: 9px; letter-spacing: 0.14em;
  }
  .status-context[hidden] { display: none; }
  .status-context i { font-style: normal; color: var(--amber-faint); font-size: 8px;
                      letter-spacing: 0.24em; }
  .status-context b { font-weight: 400; max-width: 34vw; overflow: hidden;
                      text-overflow: ellipsis; white-space: nowrap; }

  .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--ink-faint); display: inline-block; }
  .dot[data-status="on"], .dot[data-state="idle"] { background: var(--good); box-shadow: 0 0 7px var(--good); }
  .dot[data-status="busy"] { background: var(--busy); box-shadow: 0 0 7px var(--busy); animation: throb 1.1s infinite; }
  .dot[data-status="off"], .dot[data-state="error"] { background: var(--bad); box-shadow: 0 0 7px var(--bad); }
  .dot[data-state="thinking"], .dot[data-state="answering"],
  .dot[data-state="retrieving"], .dot[data-state="searching"] {
    background: var(--amber); box-shadow: 0 0 9px var(--amber); animation: throb 0.85s infinite;
  }
  @keyframes throb { 50% { opacity: 0.25; } }

  .svc { display: inline-flex; align-items: center; gap: 5px; }
  /* Os pontos ficam maiores agora que perderam o rótulo — alvo de hover precisa de área. */
  .svc { display: flex; align-items: center; cursor: default; padding: 2px; }
  .status-services { gap: 9px; }

  /*
    A IDADE DA AFERIÇÃO — de quando é o que os pontos ao lado afirmam.

    Menor e mais apagada que tudo à volta de propósito: ela qualifica os pontos, não compete
    com eles. Quem lê o cabeçalho vê a cor do ponto; quem duvida dela acha a idade a 4px.
  */
  .svc-afericao {
    font-size: 8px; letter-spacing: 0.18em; color: var(--ink-faint);
    padding-left: 4px; white-space: nowrap;
  }
  .svc-afericao[data-tone="bad"] { color: var(--bad); }
  /*
    Leitura vencida: o grupo inteiro para de afirmar o presente.

    Nada é apagado — o que foi medido continua na tela. O que sai é a CERTEZA: sem brilho, os
    pontos deixam de ler como "isto está vivo agora" e passam a ler como o registro que são.
  */
  .status-services[data-afericao="vencida"] .dot { box-shadow: none; opacity: 0.45; }

  /* ---------------- systray ---------------- */

  .header-right { display: flex; align-items: flex-start; gap: 16px; }
  /* Os glifos alinham pela primeira linha do relógio, não pelo bloco inteiro. */
  .systray { display: flex; align-items: center; gap: 4px; padding-top: 2px; }
  /* Segmentado: uma moldura, dois lados, e o ativo se destaca por PREENCHIMENTO — a mesma
     gramática dos outros grupos da HUD, e legível sem cor (o `aria-pressed` também o diz). */
  .cena-switch { display: flex; border: 1px solid var(--line); border-radius: 3px; overflow: hidden; margin-right: 8px; }
  .cena-switch .btn { border: 0; border-radius: 0; letter-spacing: .08em; opacity: .55; }
  .cena-switch .btn[aria-pressed="true"] { background: var(--accent-dim, #1b2540); color: var(--accent, #ffd9a0); opacity: 1; }
  /* `relative` para o menu ancorar no item, e não no header inteiro. */
  .tray-item { position: relative; }

  /*
    O menu ancorado sob o item.

    `pointer-events: auto` explícito: o `#hud` inteiro é `pointer-events: none` e só
    `a/button/input/.clickable` reativam — um `div` interativo nasce MORTO ao clique aqui, e
    isso já quebrou o scrubber e o leitor de arquivo. Os botões de dentro funcionariam por
    conta própria, mas o painel precisa engolir o clique que cai entre eles, senão o gesto
    atravessa para o céu e arrasta a câmera por baixo do menu aberto.
  */
  .tray-menu {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 9;
    display: flex; flex-direction: column; gap: 4px; padding: 6px;
    min-width: 132px; pointer-events: auto;
    background: rgba(4, 6, 10, 0.94); border: 1px solid var(--line);
    backdrop-filter: blur(6px);
  }
  .tray-menu[hidden] { display: none; }
  /* Container flex encolhe os filhos abaixo do conteúdo; o rótulo quebraria em duas linhas. */
  .tray-menu .btn { flex: 0 0 auto; white-space: nowrap; justify-content: flex-start; }

  /*
    ⚠️ O `#hud` é `position: fixed` e CRIA CONTEXTO DE EMPILHAMENTO: nenhum z-index interno
    vence o `#bodies` (z-index 2), que é irmão dele. O menu abre sobre o céu, então o `#hud`
    inteiro precisa subir enquanto ele estiver aberto — o mesmo caminho já usado pelo leitor de
    arquivo logo abaixo. O `:has()` limita a elevação ao tempo do menu aberto: elevar sempre
    poria a HUD na frente dos corpos clicáveis o tempo todo.
  */
  #hud:has(.tray-menu:not([hidden])) { z-index: 3; }

  /* O ITEM aberto fica aceso — é como se sabe qual menu está na tela sem olhar para ele. */
  .btn[data-tray][aria-expanded="true"] { border-color: var(--amber-dim); }
  .btn[data-tray][aria-expanded="true"] svg { stroke: var(--btn-accent); }

  /*
    Estado no PRÓPRIO glifo — a regra que economiza o espaço.

    `web` é TRI-ESTADO e os três precisam ser distinguíveis à distância: `auto` neutro (o
    sistema decide), `on` aceso (vai pesquisar), `off` apagado com um risco por cima (não vai).
    ⚠️ `auto` NÃO é "desligado": ele significa não mandar o parâmetro. Tratá-lo como booleano
    já quebrou uma vez — o AUTO enviava `web=0`, que o servidor lê como "não pesquise".
  */
  .btn[data-tray="voice"][data-on="true"] svg { stroke: var(--btn-accent); }
  .btn[data-tray="web"][data-mode="on"] svg { stroke: var(--btn-accent); }
  .btn[data-tray="web"][data-mode="off"] svg { stroke: var(--ink-faint); }
  .btn[data-tray="web"][data-mode="off"]::after {
    content: ''; position: absolute; left: 5px; right: 5px; top: 50%;
    border-top: 1px solid var(--bad); transform: rotate(-32deg);
  }
  .btn[data-tray="web"] { position: relative; }

  .clockbox { text-align: right; }
  .clockbox strong { font-size: 26px; font-weight: 300; color: var(--ink); letter-spacing: 0.05em; }
  .clockbox sub { font-size: 12px; color: var(--amber-dim); vertical-align: baseline; }
  .clockbox div { color: var(--ink-faint); font-size: 8.5px; letter-spacing: 0.22em; }

  /* ---------------- colunas ---------------- */

  /*
    FUNDO nos trilhos — e ele NÃO é um painel.

    Com o fundo do universo ligado, texto hairline sobre nebulosa vira ilegível: o contraste
    depende do que passa por trás, que muda a cada rotação de imagem. Mas devolver um painel
    opaco desfaria o respiro que acabou de entrar e traria de volta o efeito de moldura.

    O meio-termo é um gradiente ANCORADO NA BORDA: forte onde ninguém olha a cena, nulo onde ela
    começa. O olho lê como escurecimento do espaço, não como caixa — não há aresta em lugar
    nenhum. Some junto com o resto no modo cinematográfico, porque lá a cena é o assunto.
  */
  aside {
    display: flex; flex-direction: column; gap: clamp(10px, 2vh, 24px);
    min-height: 0; overflow: hidden; position: relative;
  }
  aside::before {
    content: ''; position: absolute; top: calc(var(--gutter) * -1); bottom: calc(var(--gutter) * -1);
    width: calc(100% + var(--gutter) * 2); pointer-events: none; z-index: -1;
  }
  aside[data-slot="left"]::before {
    left: calc(var(--gutter) * -1);
    background: linear-gradient(90deg, rgba(4, 6, 10, 0.82) 0%, rgba(4, 6, 10, 0.62) 48%, transparent 100%);
  }
  aside[data-slot="right"]::before {
    right: calc(var(--gutter) * -1);
    background: linear-gradient(270deg, rgba(4, 6, 10, 0.82) 0%, rgba(4, 6, 10, 0.62) 48%, transparent 100%);
  }
  body.cinematic aside::before { opacity: 0; transition: opacity 900ms ease; }
  aside section { min-height: 0; display: flex; flex-direction: column; }
  /*
    ROLA. Era `overflow: hidden`, e o conteúdo simplesmente sumia cortado no meio de uma linha —
    a árvore de arquivos parava em `.github` e o log de eventos cortava "TOPOLOGIA CARREGADA"
    pela metade. Conteúdo cortado sem barra não lê como "tem mais abaixo": lê como bug.

    Barra fina e sem fundo, para não devolver a moldura que acabou de sair.
  */
  .scroll {
    overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column; gap: 4px;
    scrollbar-width: thin; scrollbar-color: var(--amber-dim) transparent;
    /* O `#hud` é `pointer-events: none`; sem isto a roda do mouse ia para a câmera, não para a
       lista — o mesmo defeito que a pista de scrub já teve. */
    pointer-events: auto;
  }

  /* A COR DO VÍNCULO, e ela é a MESMA do arco na cena — `universe.js` (`COR_DO_VINCULO`) é a
     fonte, isto é a cópia que a tela precisa. Sem o par, a linha colorida no céu e o nome no
     painel seriam dois fatos sem ligação declarada, e a cor viraria enfeite.
     ⚠️ Divergiram? O código está certo e isto está velho. */
  [data-vinculo="SIMILAR_TO"] .fs-meta, [data-vinculo="SIMILAR_TO"] .vital-label { color: #6fe0ff; }
  [data-vinculo="CO_EDITED"] .fs-meta, [data-vinculo="CO_EDITED"] .vital-label { color: #ff5fa2; }
  [data-vinculo="REFERENCES"] .fs-meta, [data-vinculo="REFERENCES"] .vital-label { color: #ffcf5c; }
  [data-vinculo="IMPORTS"] .fs-meta, [data-vinculo="IMPORTS"] .vital-label { color: #8affc0; }

  .vital { display: grid; grid-template-columns: 1fr auto auto; align-items: baseline; gap: 6px; padding: 3px 0; }
  .vital-label { color: var(--ink-faint); font-size: 8.5px; letter-spacing: 0.18em; }
  .vital-value { color: var(--ink); font-size: 14px; font-weight: 400; }
  .vital-unit { color: var(--ink-faint); font-size: 8px; }

  .row { animation: slide-in 320ms cubic-bezier(0.16, 1, 0.3, 1) both; display: grid; grid-template-columns: auto 1fr auto; gap: 7px; padding: 2px 0; color: var(--ink-dim); }
  .row-time { color: var(--ink-faint); }
  .row-meta { color: var(--amber-dim); font-size: 9px; }
  .row.dim { color: var(--ink-faint); }
  .row.good .row-text { color: var(--good); }
  .row.warn .row-text { color: var(--busy); }
  .row.bad .row-text { color: var(--bad); }

  /*
    OS AVISOS DE PÉ (`notice`) — a CABEÇA da timeline, não uma superfície nova.

    Quem conta o que o sistema fez sozinho já é este widget; o que muda é a VIDA. Uma linha de
    timeline é um INSTANTE e rola embora; um aviso de pé é uma CONDIÇÃO e fica até um `info` do
    mesmo tópico apagá-la. Por isso os dois moram no mesmo nó e em containers separados: o
    `feed` da timeline poda pelo último filho, e um aviso de pé dentro dele seria podado.

    A codificação é de DUAS perguntas em dois pixels, nunca duas rampas na mesma tinta:
    a SEVERIDADE colore o que aconteceu (marca + rótulo), a IDADE colore há quanto tempo — na
    mesma rampa da célula ÍNDICE do cabeçalho (3d âmbar, 7d vermelho), porque o que envelhece
    devagar passa despercebido em cinza.

    O `action` é a linha mais clara do bloco depois do rótulo: é o que o operador vai fazer. É o
    mesmo degrau de `.tool-detail.out` sobre `.tool-detail` — a metade que informa vem um tom
    acima da que descreve.
  */
  .avisos:empty { display: none; }
  .avisos { display: flex; flex-direction: column; gap: 9px; padding-bottom: 11px; }
  .timeline-rows { display: flex; flex-direction: column; gap: 4px; }

  .aviso { animation: slide-in 320ms cubic-bezier(0.16, 1, 0.3, 1) both; display: flex; flex-direction: column; gap: 2px; }
  .aviso-head { display: grid; grid-template-columns: auto auto 1fr auto; gap: 7px; align-items: baseline; }
  .aviso-mark { width: 4px; height: 4px; display: block; align-self: center; background: var(--busy); }
  .aviso[data-severity="alert"] .aviso-mark { background: var(--bad); }
  .aviso-topic { color: var(--amber-faint); font-size: 8px; letter-spacing: 0.2em; }
  .aviso-label { color: var(--busy); }
  .aviso[data-severity="alert"] .aviso-label { color: var(--bad); }
  .aviso-age { color: var(--ink-faint); font-size: 9px; }
  .aviso-age[data-tone="warn"] { color: var(--busy); }
  .aviso-age[data-tone="bad"] { color: var(--bad); }
  .aviso-detail { color: var(--ink-faint); font-size: 9px; line-height: 1.45; }
  .aviso-action { color: var(--ink-dim); font-size: 9.5px; line-height: 1.45; }

  .plan-step { display: grid; grid-template-columns: auto 1fr auto; gap: 7px; align-items: center; padding: 2px 0; }
  .plan-mark { width: 4px; height: 4px; background: var(--amber-dim); display: block; }
  .plan-label { color: var(--ink-dim); font-size: 9.5px; }
  .plan-target { color: var(--ink-faint); font-size: 8px; }

  .hit { animation: slide-in 380ms cubic-bezier(0.16, 1, 0.3, 1) both; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.03); }
  .hit-head { display: flex; gap: 7px; }
  .hit-score { color: var(--amber); }
  .hit-path { color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hit-section { color: var(--ink-faint); font-size: 9px; }
  .hit-text { color: var(--ink-faint); font-size: 9px; line-height: 1.45; max-height: 2.9em; overflow: hidden; }

  .tool { animation: slide-in 300ms cubic-bezier(0.16, 1, 0.3, 1) both; padding: 2px 0; display: grid; grid-template-columns: auto 1fr auto; gap: 7px; align-items: center; }
  .tool-dot { width: 5px; height: 5px; border-radius: 50%; display: block; }
  .tool-name { color: var(--ink-dim); }
  .tool-meta { color: var(--ink-faint); font-size: 9px; }
  .tool-detail { grid-column: 2 / -1; color: var(--ink-faint); font-size: 8.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* O RETORNO da ferramenta, um tom acima da entrada: é a metade que informa. Em falha ele é a
     mensagem do erro, e aí acompanha a cor do nome. */
  .tool-detail.out { color: var(--ink-dim); }
  .tool.bad .tool-detail.out { color: var(--bad); }
  .tool.done .tool-name { color: var(--ink); }
  .tool.bad .tool-name { color: var(--bad); }

  .web-item { padding: 3px 0; }
  .web-item.off { opacity: 0.4; }
  .web-provider { color: var(--amber-dim); font-size: 8px; letter-spacing: 0.2em; margin-right: 6px; }
  .web-title { color: var(--ink-dim); font-size: 9.5px; text-decoration: none; }
  a.web-title:hover { color: var(--amber); }
  .web-snippet { color: var(--ink-faint); font-size: 8.5px; line-height: 1.4; max-height: 2.8em; overflow: hidden; }

  /* ---------------- centro: resposta ---------------- */

  .stage { grid-column: 2; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; min-height: 0; gap: 10px; }

  /*
    Prosa alinhada à esquerda, largura de leitura, e um scrim atrás.
    A primeira versão centralizava o texto: bonito em uma frase, ilegível em seis — cada
    linha começa num x diferente e o olho perde o ponto de retorno. O scrim existe porque
    texto sobre o disco de acreção não tem contraste garantido em nenhuma cor.
  */
  .answer {
    max-width: min(680px, 94%);
    width: 100%;
    text-align: left;
    font-size: 12.5px;
    line-height: 1.72;
    color: var(--ink);
    letter-spacing: 0.02em;
    max-height: 36vh;
    overflow-y: auto;
    padding: 14px 18px;
    background: linear-gradient(180deg, rgba(4,6,10,0) 0%, rgba(4,6,10,0.82) 12%, rgba(4,6,10,0.82) 88%, rgba(4,6,10,0) 100%);
    backdrop-filter: blur(2px);
    pointer-events: auto;
  }
  .answer:empty { display: none; }
  /* Nada entra em corte seco: bloco novo nasce transparente e deslizando de baixo. */
  .answer, .sources, .answer-meta { animation: rise 520ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  .answer-p { margin: 0 0 0.85em; }
  .answer-p:last-child { margin-bottom: 0; }
  .answer-list { margin: 0 0 0.85em; padding-left: 1.1em; list-style: none; }
  .answer-list li { position: relative; margin-bottom: 0.35em; }
  .answer-list li::before {
    content: '·'; position: absolute; left: -1em; color: var(--amber-dim);
  }
  .answer-strong { color: #fff; font-weight: 500; }
  .answer-code {
    font-family: inherit; font-size: 11.5px; color: var(--amber);
    background: rgba(255, 179, 92, 0.09); padding: 0 4px; border-radius: 2px;
  }
  .answer-error { color: var(--bad); font-size: 10px; margin-top: 8px; }

  /* Só aparece quando há resposta na tela — botão de fechar o que não existe é ruído. */
  .answer-dismiss {
    align-self: flex-end; background: none; border: 1px solid var(--line);
    color: var(--ink-faint); font: inherit; font-size: 8px; letter-spacing: 0.22em;
    padding: 4px 9px; cursor: pointer; opacity: 0; pointer-events: none;
    transition: opacity 260ms ease, color 160ms ease;
  }
  .stage.has-answer .answer-dismiss { opacity: 1; pointer-events: auto; }
  .answer-dismiss:hover { color: var(--amber); border-color: var(--amber-dim); }

  .cite {
    background: none; border: none; cursor: pointer; font: inherit;
    color: var(--amber); padding: 0 2px;
  }
  .cite:hover { color: #fff; }
  .cite.invalid { color: var(--ink-faint); text-decoration: line-through; cursor: not-allowed; }

  .answer-meta { color: var(--ink-faint); font-size: 8.5px; letter-spacing: 0.2em; }

  /*
    A LISTA DE FONTES — teto, rolagem, scrim, e o CORTE PUBLICADO.

    Ela nasceu sem os quatro. As 24 linhas do caso normal não são amostra: são
    `MEMORY_LIMIT` 6 (`server/agent.py`) + `MAX_RESULTS` 6 (`server/websearch.py`) × os provedores
    com chave — um provedor a mais são mais seis linhas, por construção. Sem teto elas empilham
    sobre o disco de acreção, e o que passa da altura do palco não rola: **SUMIA**, porque
    `.widget-body` é `overflow: hidden`. É o modo de falha desta base — a tela deixa de afirmar sem
    acusar — e aqui ele é pior que em outros lugares, porque `[n]` é CONTRATO com o prompt
    (`agent.sources_of`, `EVENTS.md`): a linha que some leva junto o destino de uma citação que
    continua escrita na resposta.

    As quatro peças, e nenhuma sozinha basta:

    1. TETO (`max-height`) — e ele é do CSS, NUNCA do JS. Cortar a lista em JS jogaria fora fontes
       que o modelo citou; cortar a VISTA deixa as 24 no DOM, alcançáveis pela rolagem e pelo
       clique na citação (`hud/answer.js`, `deslocamentoAte`).
    2. ROLAGEM (`overflow-y: auto`), e ela anda em par com o PONTEIRO: o `#hud` é
       `pointer-events: none`, e barra que não se pode agarrar é enfeite — é a lição 1 do
       `.surface`, que já custou um painel com `overflow-y: auto` que mesmo assim não rolava.
       ⚠️ O preço é uma zona morta sobre o canvas (~680×20vh), que CANCELA órbita e zoom nesse
       retângulo. É custo DECLARADO, não descoberto: quem o mede é `spatia.hud().ponteiro`, e a
       zona morta do palco é T-51.
    3. SCRIM em GRADIENTE, o mesmo do `.answer` — nunca fundo opaco: `hud/yield.js` já mediu que a
       HUD hairline vive de pouco contraste e o perderia com painel sólido. Sem `backdrop-filter`
       aqui: o `.answer` logo acima já paga um passe de composição, e o segundo compraria
       contraste que o gradiente e o `text-shadow` do `#hud` já dão.
    4. O CORTE PUBLICADO (`.sources-total`, grudado no topo) — a peça que impede o teto de mentir.
       O precedente é o teto de 28 arcos da rede, que viaja com o `total` real ao lado
       (`apps/context.js`, `legenda()`): *"truncamento silencioso lê como 'isto é tudo o que
       existe'"*. Com o cabeçalho dizendo 24 e sete linhas à vista, o corte está DITO.

    A ARITMÉTICA do teto, e ela só é exata porque `line-height` é DECLARADO abaixo:

        node -e 'const l=9*1.45, p=l+2, v=742*0.20-20-21; console.log(l, p, Math.floor(v/p))'
        # 13.05 (linha) · 15.05 (passo) · 7 (linhas à vista)

    20vh na janela de 742px CSS (a do §6 do `HANDOFF.md`) = 148,4px; menos 20px de padding e ~21px
    de cabeçalho sobram ~107px → **7 linhas à vista, 24 no DOM**. Em janela maior cabem mais, e é
    isso que o teto em `vh` compra.
    ⚠️ Sem `line-height` declarado a altura da linha é `normal` (~1,2, e depende da fonte): a conta
    vira estimativa, que foi como o "≈305px" da varredura nasceu sem procedência.
    Portão: `scripts/lei-fontes.mjs`.
  */
  .sources {
    display: flex; flex-direction: column; gap: 2px;
    max-width: min(680px, 94%); width: 100%;
    max-height: 20vh;
    overflow-y: auto; overscroll-behavior: contain;
    pointer-events: auto;
    scrollbar-width: thin; scrollbar-color: var(--amber-dim) transparent;
    padding: 10px 18px;
    background: linear-gradient(180deg, rgba(4,6,10,0) 0%, rgba(4,6,10,0.82) 12%, rgba(4,6,10,0.82) 88%, rgba(4,6,10,0) 100%);
  }
  /* Sem resposta não há lista, e uma caixa vazia que reivindica o ponteiro é zona morta de graça. */
  .sources:empty { display: none; }
  /* Lição 3 do `.surface`: item de flex ENCOLHE por padrão — sem isto as linhas se espremem dentro
     do teto em vez de transbordar, e não sobra o que rolar. */
  .sources > * { flex: 0 0 auto; }
  /*
    O TOTAL fica GRUDADO no topo: rolar não pode levar embora a única coisa que diz quantas são.
    Opaco o bastante para as linhas passarem POR BAIXO — texto hairline sobre texto hairline é
    ilegível nos dois. As margens negativas o fazem cobrir o padding da caixa, senão a primeira
    linha reaparece pelas beiradas.
  */
  .sources-total {
    position: sticky; top: 0; z-index: 1;
    margin: -10px -18px 2px; padding: 10px 18px 3px;
    background: rgba(4, 6, 10, 0.92);
    color: var(--amber-faint); font-size: 8px; letter-spacing: 0.2em;
  }
  /* `line-height` DECLARADO: é ele que torna o teto acima uma conta, e não uma estimativa. */
  .source { display: grid; grid-template-columns: auto 1fr auto; gap: 7px; font-size: 9px; line-height: 1.45; color: var(--ink-faint); }
  .source-n { color: var(--amber-dim); }
  .source-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; cursor: pointer; text-decoration: none; color: inherit; }
  .source-label:hover { color: var(--amber); }
  .source.active { color: var(--ink); }
  .source.active .source-n { color: var(--amber); }

  /* ---------------- rodapé: terminal ---------------- */

  /*
    O rodapé inteiro acompanha a largura do prompt flutuante.

    Só o `.prompt-line` tinha sido solto e centrado, e os irmãos dele — anexos e a dica de voz —
    ficaram ancorados na borda esquerda, órfãos de um bloco que não estava mais lá. Um elemento
    alinhado a uma referência que sumiu não lê como "à esquerda": lê como erro.
  */
  footer {
    grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; gap: 8px;
  }
  footer > * { width: min(920px, 100%); }

  /* Três zonas: compositor (elástico), forma de onda, configuração. */
  /*
    O prompt FLUTUA em vez de ser uma barra de terminal colada na largura toda.

    A régua atravessada de ponta a ponta era metade do efeito de moldura: ela FECHAVA o quadro
    por baixo. Solto e com teto de largura, ele vira um objeto sobre a cena — e como a cena
    continua visível em volta, o prompt deixa de parecer o chão da tela.

    `backdrop-filter` em vez de fundo opaco: o universo continua lá atrás, só desfocado o
    bastante para o texto não brigar com uma nebulosa.
  */
  .prompt-line {
    display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 18px;
    width: min(920px, 100%); margin: 0 auto; padding: 9px 14px;
    background: rgba(6, 9, 14, 0.52);
    backdrop-filter: blur(14px) saturate(0.9);
    border: 1px solid var(--line); border-radius: 3px;
  }

  /*
    O compositor tem moldura própria — é o que declara "isto aqui é um campo, e estes botões
    são dele". Sem a moldura, anexo e mic ficavam visualmente indistinguíveis dos toggles de
    configuração ao lado.
  */
  .composer {
    display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 9px;
    border: 1px solid var(--line); padding: 5px 8px 5px 11px;
    transition: border-color 200ms ease;
  }
  .composer:focus-within { border-color: var(--amber-dim); }
  .prompt-tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }

  .prompt-caret { color: var(--amber); font-size: 15px; }
  .prompt-wrap { position: relative; }
  .prompt-wrap input {
    width: 100%; background: none; border: none; outline: none;
    color: var(--ink); font: inherit; font-size: 13px; letter-spacing: 0.05em; caret-color: var(--amber);
  }
  .prompt-ghost { position: absolute; inset: 0; color: var(--ink-faint); pointer-events: none; font-size: 13px; }

  canvas.waveform { width: 110px; height: 24px; }

  /*
    Botão de ação que muda de papel: mic quando não há texto, enviar quando há, parar quando
    está gravando. É o padrão do WhatsApp/Telegram, e resolve o problema que o "segure espaço"
    tinha por construção — não existe tecla envolvida, então falar nunca digita.
  */
  /* ---------------- o primitivo de botão ---------------- */
  /*
    UM botão, com `data-variant` e `data-size`. Antes eram seis (`.toggle`, `.perm-mode`,
    `.icon-btn`, `.dock-item`, `.fs-row`, `.chip-drop`), e o custo era seis lugares onde padding e
    cor de estado divergiam sozinhos — o painel de voz já usava `.perm-mode` para um botão que não
    é modo de permissão, por ser o fork mais parecido.

    A regra: o estilo mora AQUI. O call site escolhe variante e tamanho; ele não redefine padding
    nem cor. O que ele pode passar é `--btn-accent` (a dock tem cor por app) e `data-tone`.

    Contrato em `src/hud/button.js`.
  */
  .btn {
    --btn-accent: var(--amber);
    pointer-events: auto; cursor: pointer; font: inherit; background: none;
    border: 1px solid transparent; color: var(--ink-faint);
    display: inline-flex; align-items: center; justify-content: center;
    transition: color 160ms ease, border-color 160ms ease, background 160ms ease;
  }

  .btn[data-size="xs"] { font-size: 8px; letter-spacing: 0.14em; padding: 3px 7px; gap: 5px; }
  .btn[data-size="sm"] { font-size: 8.5px; letter-spacing: 0.2em; padding: 4px 9px; gap: 7px; }
  /* `md` é quadrado por definição: é o tamanho do botão de glifo, não de texto. */
  .btn[data-size="md"] { width: 30px; height: 26px; padding: 0; }
  /* `row` herda o tamanho de fonte do contexto — quem manda no texto é o `.fs-name` dentro. */
  .btn[data-size="row"] { padding: 2px 0; gap: 7px; }
  /*
    `lg`: botão de texto que é a AÇÃO da tela, não um controle no canto dela. Existe para o gate
    do boot. Entrou no primitivo em vez de virar regra local porque tamanho é exatamente o que o
    primitivo possui — a alternativa era o boot redefinir padding e fonte por fora, que é o fork
    que este arquivo já pagou uma vez.
  */
  .btn[data-size="lg"] { font-size: 10px; letter-spacing: 0.3em; padding: 12px 26px; gap: 9px; }

  /* Interruptor independente: tinta e borda acentuadas quando ligado. */
  .btn[data-variant="outline"] { border-color: var(--line); }
  .btn[data-variant="outline"]:hover { color: var(--btn-accent); border-color: var(--amber-dim); }
  .btn[data-variant="outline"][data-on="true"] { color: var(--btn-accent); border-color: var(--amber-dim); }

  /* Opção de conjunto exclusivo: preenchimento sólido, para "escolhido" não ler como "sob o cursor". */
  .btn[data-variant="select"] { border-color: var(--line); }
  .btn[data-variant="select"]:hover:not([data-on="true"]) { color: var(--btn-accent); border-color: var(--amber-dim); }
  .btn[data-variant="select"][data-on="true"] {
    color: var(--void); background: var(--btn-accent); border-color: var(--btn-accent);
  }

  /* Glifo. O `stroke` do SVG é chrome do botão, então vive aqui e não no call site. */
  .btn[data-variant="icon"] { border-color: var(--line); }
  .btn[data-variant="icon"] svg { width: 15px; height: 15px; fill: none; stroke: var(--ink-dim);
                                  stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .btn[data-variant="icon"]:hover { border-color: var(--amber-dim); }
  .btn[data-variant="icon"]:hover svg { stroke: var(--btn-accent); }
  .btn[data-variant="icon"][data-on="true"] { background: var(--btn-accent); border-color: var(--btn-accent); }
  .btn[data-variant="icon"][data-on="true"] svg { stroke: var(--void); }
  /* Sem `data-on`, mas em destaque: a ação principal do compositor. */
  .btn[data-variant="icon"][data-emphasis="primary"] { border-color: var(--amber-dim); }
  .btn[data-variant="icon"][data-emphasis="primary"] svg { stroke: var(--btn-accent); }
  .btn[data-variant="icon"][data-tone="bad"] { background: none; border-color: var(--bad); }
  .btn[data-variant="icon"][data-tone="bad"] svg { stroke: var(--bad); fill: var(--bad);
                                                   animation: throb 1s infinite; }

  /* Linha de lista que é botão: grade de três colunas, sem moldura. */
  .btn[data-variant="row"] {
    display: grid; grid-template-columns: auto 1fr auto; align-items: baseline;
    text-align: left; color: var(--ink-dim); justify-content: initial;
  }
  .btn[data-variant="row"]:hover { color: var(--ink); }
  .btn[data-variant="row"][data-on="true"] .fs-name { color: var(--btn-accent); }

  /* Sem moldura nenhuma. Uma ação que não é um alvo visual — descartar, fechar. */
  .btn[data-variant="bare"] { padding: 0; font-size: 11px; line-height: 1; }
  .btn[data-variant="bare"]:hover { color: var(--bad); }

  /*
    Foco visível, na cor do sistema.

    O default do browser é um anel AZUL — a única coisa azul numa interface de âmbar sobre
    vazio, e ela aparecia em cima do botão em foco no boot. Tirar o anel sem substituir seria
    pior: quem navega por teclado perderia a única pista de onde está. `:focus-visible` (e não
    `:focus`) porque o anel deve aparecer para o teclado, não a cada clique de mouse.
  */
  .btn:focus-visible { outline: 2px solid var(--btn-accent); outline-offset: 2px; }

  /*
    Ênfase primária: a ação que a tela está propondo.

    Duas ações lado a lado com o MESMO peso não são uma escolha, são um enigma — foi como o
    gate do boot nasceu. A regra é genérica de propósito: a variante `icon` já tinha a dela
    (mais específica, continua valendo), e não faz sentido cada variante reinventar "esta é a
    principal".
  */
  .btn[data-emphasis="primary"] { color: var(--btn-accent); border-color: var(--btn-accent); }
  .btn[data-emphasis="primary"]:hover { background: var(--btn-accent); color: var(--void); }

  /*
    Troca de GLIFO do botão de ação, e não de estilo: é qual SVG aparece, não como o botão se
    desenha. Por isso mora fora do primitivo, atada ao próprio botão do compositor.
  */
  [data-send-btn] .ico-mic, [data-send-btn] .ico-send, [data-send-btn] .ico-stop { display: none; }
  [data-send-btn][data-mode="mic"] .ico-mic,
  [data-send-btn][data-mode="send"] .ico-send,
  [data-send-btn][data-mode="stop"] .ico-stop { display: block; }

  .attachments { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 5px; }
  .attachments:empty { display: none; }
  /* `.chip` é o contêiner do anexo, não um botão: o único botão dentro dele é o de descartar. */
  .chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line);
          padding: 3px 7px; font-size: 8px; letter-spacing: 0.14em; color: var(--ink-dim);
          pointer-events: auto; }
  .chip.pending { opacity: 0.5; }

  .footer-hints { display: flex; justify-content: space-between; color: var(--ink-faint); font-size: 8px; letter-spacing: 0.2em; }

  /* ---------------- inspetor e hover ---------------- */

  .inspector {
    position: fixed; right: var(--gutter); top: 20vh; width: min(420px, 34vw);
    max-height: 56vh; display: none; flex-direction: column; gap: 8px;
    background: linear-gradient(180deg, rgba(4,6,10,0.94), rgba(4,6,10,0.82));
    border-left: 1px solid var(--amber-dim); padding: 12px 14px; pointer-events: auto; overflow: hidden;
  }
  .inspector .label { align-items: center; }
  .inspector-close {
    background: none; border: none; color: var(--ink-faint); font: inherit; font-size: 15px;
    line-height: 1; cursor: pointer; padding: 0 2px; transition: color 160ms ease;
  }
  .inspector-close:hover { color: var(--amber); }
  .inspector.open { display: flex; animation: rise 460ms cubic-bezier(0.16, 1, 0.3, 1) both; }
  .inspector-body { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .chunk-section { color: var(--amber-dim); font-size: 8.5px; letter-spacing: 0.2em; }
  .chunk-text { color: var(--ink-dim); font-size: 9.5px; line-height: 1.55; white-space: pre-wrap; word-break: break-word; font-family: inherit; }

  .hover {
    position: fixed; left: 50%; bottom: 15vh; transform: translateX(-50%);
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    opacity: 0; transition: opacity 180ms ease;
  }
  .hover.on { opacity: 1; }
  .hover-label { color: var(--ink); font-size: 11px; letter-spacing: 0.16em; }
  .hover-meta { color: var(--ink-faint); font-size: 8.5px; letter-spacing: 0.2em; }

  /* ---------------- fendas de widget, dock e corpos ---------------- */

  #hud { grid-template-rows: auto 1fr auto auto; }
  .slot[data-slot="strip"] { grid-column: 1 / -1; display: flex; gap: var(--gutter); }
  .slot[data-slot="strip"]:empty { display: none; }
  /* Residente da faixa: divide a largura com os irmãos em vez de encolher ao conteúdo. */
  .widget-strip { flex: 1; min-width: 0; }

  .widget { display: flex; flex-direction: column; min-height: 0; }
  .widget-stage { flex: 1; justify-content: flex-end; align-items: center; gap: 10px; }
  .widget-body { min-height: 0; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
  .widget-stage > .widget-body { width: 100%; align-items: center; }

  /*
   * Leitura de arquivo é o único widget do palco que é PROSA LONGA.
   *
   * Os outros do palco (resposta, plano) são curtos e ficam melhor flutuando sobre a cena. Este
   * não: sem fundo, o texto do arquivo se mistura com o campo estelar; e com o `overflow:
   * hidden` herdado de `.widget-body`, o que passa da altura simplesmente não existe — não
   * corta com aviso, desaparece.
   *
   * Por isso o escopo é `[data-widget="fs-content"]` e não `.widget-stage`: dar painel a todo
   * widget do palco tamparia o buraco negro para ler duas linhas de resposta.
   */
  /*
   * Empilhamento do leitor — duas camadas, porque uma não bastava.
   *
   * 1) Dentro da HUD: `position: relative` porque z-index não vale em elemento estático, e 8
   *    para passar na frente do `.inspector` (z-index auto) e dos demais slots.
   *
   * 2) Acima do `#bodies`: o `#hud` é `position: fixed`, e isso cria contexto de empilhamento
   *    — logo z-index no painel NUNCA venceria o `#bodies` (z-index 2), que é irmão do `#hud` e
   *    desenha os astros orbitais por cima de toda a HUD. A elevação tem que ser do `#hud`.
   *
   * O `:has()` limita essa elevação ao tempo em que o leitor está montado. Elevar o `#hud` de
   * forma permanente mataria a ilusão de profundidade em que os astros passam à frente da
   * interface — que é o efeito, não um acidente. Ler arquivo é um modo; fora dele, nada muda.
   */
  /* ---------------- superfície de painel (o primitivo) ---------------- */

  /*
    UMA superfície para tudo que é "janela": o leitor de arquivo e os painéis de configuração.
    O leitor já tinha resolvido, à força, os quatro problemas que qualquer painel central tem —
    e as soluções estavam presas ao seletor dele. Painel novo ou recomeçava do zero, ou virava
    um fork com metade das lições. As quatro estão logo abaixo, num lugar só.

    O leitor continua no palco (ele é conteúdo de um app); os painéis de configuração continuam
    overlays fixos, porque ⌘G / P / V têm que valer em QUALQUER rota e um widget só existe
    dentro do app que o declara. O que é compartilhado é a superfície, não o mecanismo de
    montagem.
  */
  .surface {
    pointer-events: auto;             /* lição 1, abaixo */
    position: relative; z-index: 8;   /* lição 2 */
    overflow-y: auto; overflow-x: hidden;
    background: linear-gradient(180deg, rgba(4,6,10,0.96), rgba(4,6,10,0.9));
    border-left: 1px solid var(--amber-dim);
    padding: 12px 14px 14px;
    backdrop-filter: blur(4px);
    /* lição 4: barra discreta — a HUD é hairline. */
    scrollbar-width: thin; scrollbar-color: var(--amber-dim) transparent;
  }
  /* lição 3: item de flex ENCOLHE por padrão; sem isto não há transbordo e não há o que rolar. */
  .surface > * { flex: 0 0 auto; }
  /*
    O × pregado no topo à direita. `sticky` e não `absolute`: a superfície ROLA, e um botão de
    fechar que sai de vista ao rolar obriga a rolar de volta só para poder sair.
  */
  .surface-close {
    position: sticky; top: 0; align-self: flex-end; z-index: 2;
    font-size: 15px; line-height: 1; padding: 0 2px; margin-bottom: -6px;
    color: var(--ink-faint);
  }
  .surface-close:hover { color: var(--bad); }
  /* Rolagem em UM nível só: o corpo interno de um painel não pode disputar com a superfície. */
  .surface .perms-body { overflow: visible; min-height: auto; }

  /* Overlay: painel de configuração, centrado, sobre a cena. */
  .surface[data-surface="overlay"] {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: calc(var(--gutter) + 74px);
    width: min(660px, 72vw); max-height: 66vh;
    display: none; flex-direction: column;
  }
  .surface[data-surface="overlay"].open {
    display: flex; animation: rise 420ms cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  /*
    ⚠️ A elevação do `#hud` cobre AGORA qualquer superfície montada — leitor ou painel.
    Antes valia só para o leitor, e um painel de configuração aberto ficava atrás dos astros
    orbitais (`#bodies`, z-index 2), que passavam por cima dele.
  */
  #hud:has(.surface[data-surface="overlay"].open),
  #hud:has(.widget[data-panel-surface]) { z-index: 3; }
  /*
    Lição 1 (mora no `.surface`): o `#hud` é `pointer-events: none` para não bloquear a órbita
    da câmera, e só `a, button, input, .clickable` reativam. O corpo do leitor é `div`, então a
    roda do mouse chegava no canvas atrás — o painel tinha `overflow-y: auto` e mesmo assim não
    rolava, e `elementFromPoint` no centro dele devolvia CANVAS. Fundo e rolagem sem ponteiro é
    scrollbar de enfeite.

    Lição 2 (idem): o `#hud` é `position: fixed` e cria contexto de empilhamento, então z-index
    no painel NUNCA venceria o `#bodies`. A elevação tem que ser do `#hud`, e limitada por
    `:has()` ao tempo em que há painel montado — elevar sempre mataria a profundidade em que os
    astros passam à frente da interface, que é o efeito, não um acidente.
  */
  /*
    Widget de palco que é JANELA. O escopo era `[data-widget="fs-content"]` — o nome de UM
    widget — então a página de configuração nasceu sem fundo e o disco de acreção atravessou o
    texto. Agora quem opta é o contrato (`surface: true`), e o host marca a moldura.
  */
  .widget[data-panel-surface] {
    align-items: stretch; justify-content: flex-start;
    /*
      ☠️ A MOLDURA NÃO REIVINDICA O PONTEIRO — ela não pinta nada, e reivindicava o palco INTEIRO.

      A lição 2 vale aqui e por herança nenhuma: o widget recebe o ATRIBUTO `data-panel-surface`,
      não a classe `.surface`, e a elevação tem de ser declarada de novo. Já a lição 1 (o ponteiro)
      estava no elemento ERRADO, e a diferença é de área, não de estilo.

      A moldura é `flex: 1` dentro do palco (`.widget-stage`) — ela ESTICA até a altura da coluna
      central inteira, enquanto o que pinta é o `.widget-body`, que para em `max-height: 62vh` e na
      altura do próprio conteúdo. Tudo entre o fim do corpo e o fim da coluna era retângulo
      transparente com `pointer-events: auto` sobre o céu: e um retângulo desses não DISPUTA o
      clique, ele CANCELA órbita, zoom e pick ali (os cinco ouvintes de gesto da cena estão presos
      ao `canvas`, `space/scene.js`, sem fallback em `window`). O corpo em foco e o buraco negro são
      desenhados exatamente no meio dessa faixa.

      O escape que existia só cobria o painel VAZIO, que é o caso raro — em 7 das 10 rotas o painel
      nasce com conteúdo e a zona morta ficava de pé o tempo todo.

      A REGRA, e ela vale para qualquer superfície nova sobre o céu:
      **quem PINTA reivindica; quem só POSICIONA cede.** Aqui quem pinta é o `.widget-body`.
      `pointer-events` não move um pixel: a moldura continua ocupando o mesmo espaço, com o mesmo
      conteúdo, no mesmo lugar — o que muda é quem recebe o gesto onde não há nada desenhado.
      Portão: `scripts/lei-palco.mjs`.
    */
    pointer-events: none;
    position: relative; z-index: 8;
    /* A moldura NÃO rola em si: quem rola é o `.widget-body`, para o título ficar grudado. */
    overflow: visible;
    background: none; border: none; padding: 0; backdrop-filter: none;
  }
  /*
    O LEITOR EM REPOUSO NÃO ROUBA NEM O PRÓPRIO FUNDO.

    O ponteiro só é necessário quando há o que ROLAR ou SELECIONAR. Em repouso o conteúdo é uma
    dica de uma linha — nem uma coisa nem outra. `:only-child` é o que separa os dois estados: com
    um arquivo aberto o painel volta a capturar, porque aí ele é um documento.

    ⚠️ E o `.scroll` PRECISA estar na regra. Ele declara `pointer-events: auto` por conta própria
    (a caixa rolável dos trilhos), e `pointer-events` não é herança que um descendente respeite:
    um filho com `auto` volta a ser alvo mesmo sob um ancestral `none`. Cedendo só o corpo, a
    faixa de uma linha do `.scroll` continuava reivindicando — pouco, e do jeito que esta base
    perde guarda: em silêncio.
  */
  .widget[data-panel-surface]:has(> .widget-body > .scroll > .widget-empty:only-child) > .widget-body,
  .widget[data-panel-surface]:has(> .widget-body > .scroll > .widget-empty:only-child) > .widget-body > .scroll {
    pointer-events: none;
  }
  .widget[data-panel-surface] > .widget-body {
    /*
      ☠️ QUEM PINTA REIVINDICA. Esta é a caixa que tem fundo, borda e rolagem — e é ela, não a
      moldura, que pode cobrar o gesto ao céu. Ela para na altura do conteúdo (teto de 62vh);
      a moldura estica pela coluna toda, e por isso cede (ver o bloco acima).
    */
    pointer-events: auto;
    align-items: stretch;
    /* Vertical apenas, como pedido: linha longa quebra (`chunk-text` já faz word-break) em vez
       de criar uma segunda barra que rola o texto para fora da leitura. */
    overflow-y: auto;
    overflow-x: hidden;
    /* Precisa de teto para haver o que rolar: em flex, `min-height: 0` sem `max-height` só
       deixa o filho crescer e empurrar o resto. */
    max-height: 62vh;
    background: linear-gradient(180deg, rgba(4,6,10,0.95), rgba(4,6,10,0.88));
    border-left: 1px solid var(--amber-dim);
    padding: 12px 14px;
    gap: 10px;
    /* Barra discreta: a HUD é hairline, e scrollbar de sistema aqui pesa mais que o conteúdo. */
    scrollbar-width: thin;
    scrollbar-color: var(--amber-dim) transparent;
  }
  /*
   * O que fazia a rolagem não existir — e não era o `overflow`.
   *
   * `.widget-body` é `display: flex; flex-direction: column`, e item de flex ENCOLHE por padrão
   * (`flex-shrink: 1`). Com 39 chunks numa caixa de 442px, os 39 blocos foram comprimidos para
   * caber em vez de transbordar: medido `scrollHeight === clientHeight === 442` com os 39 no
   * DOM. Sem transbordo não há o que rolar, e o texto sai esmagado e cortado — sintoma idêntico
   * a "falta overflow", causa completamente diferente.
   *
   * `flex: 0 0 auto` devolve a altura natural a cada bloco. Aí a soma passa do teto, o
   * `overflow-y: auto` do pai finalmente tem overflow, e a barra aparece.
   */
  .widget[data-panel-surface] > .widget-body > * {
    flex: 0 0 auto;
  }
  /*
    ---------------- o DOCUMENTO ancorado no CORPO ----------------

    O conteúdo do astro travado tem ENDEREÇO: ele encosta no limbo do corpo, anda com a câmera e é
    iluminado por ele. Quem calcula é `space/ancora-de-documento.js`; este bloco só CONSOME as
    variáveis `--ancora-*` que ele escreve.

    ☠️ **É `transform`, e não `left`/`top`.** A composição não invalida layout; posição absoluta
    reescrita a 120 Hz forçaria reflow do painel inteiro por quadro. É a mesma razão de `bodies.js`
    usar `visibility` em vez de `display` nos rótulos.

    ⚠️ **QUEM RECEBE O GESTO NÃO MUDA, e é por isso que `lei-palco.mjs` continua valendo.** O que
    se move é o `.widget-body`, que é quem PINTA e por isso reivindica; a moldura
    (`[data-panel-surface]`) continua `pointer-events: none` e continua onde o flex a põe. A área
    reivindicada acompanha a tinta porque é a MESMA caixa, deslocada — não é área nova sobre o céu.

    ☠️ **SEM `transition`, e isso não é economia — é correção.** A âncora é reescrita a cada
    quadro; uma transição de N ms seria RE-MIRADA antes de terminar, virando um filtro de atraso
    que faz o documento nadar atrás do corpo. A suavidade já vem do quadro. Sem `data-ancorado`
    (sem corpo travado, painel eclipsado, corpo atrás da câmera) nada é aplicado e o painel volta
    ao lugar que o flex escolheu.
  */
  .widget[data-panel-surface][data-ancorado="sim"] > .widget-body {
    transform: translate(var(--ancora-dx, 0px), var(--ancora-dy, 0px));
    /*
      A LUZ VEM DO ASTRO, e é a mesma lei que os corpos 3D obedecem (`space/bodies.js`: a fonte
      está na origem, e o lado voltado para ela é o lado aceso). Aqui a fonte é o corpo em foco, e
      o centro do gradiente chega em coordenadas da CAIXA — logo ele fica preso ao MUNDO enquanto a
      caixa se move. É daí que sai o paralaxe: um mecanismo, dois efeitos.

      A primeira parada do gradiente é AMBAR e não é decoração: é a cor do que ilumina esta cena
      (`--amber` do disco de acreção), então o painel encostado num astro fica quente do lado dele
      e frio do lado oposto. Sem isso o fundo era `linear-gradient(180deg, …)` — luz vinda de cima,
      que não existe em lugar nenhum desta cena.

      ⚠️ O PISO DE ALFA é 0,88 na parada mais clara, e ele não é gosto: o painel carrega PROSA
      LONGA sobre campo estelar, e transparência abaixo disso põe estrela dentro de linha de texto.
      Profundidade aqui é COR e GRADIENTE, nunca menos opacidade.

      O RAIO cobre até o canto mais distante da caixa, então a queda vale em qualquer
      enquadramento. Quem o corpo governa é a FORÇA (`--ancora-luz-forca`, razão do raio aparente
      contra um limiar FIXO): astro grande na tela empurra a parada quente mais para dentro do
      painel; astro de 4 px quase não o alcança.
    */
    background-image:
      radial-gradient(
        circle var(--ancora-luz-raio, 420px)
          at calc(50% + var(--ancora-luz-x, 0px)) calc(50% + var(--ancora-luz-y, 0px)),
        rgba(46, 30, 14, 0.90) 0%,
        rgba(14, 12, 13, 0.94) calc(8% + var(--ancora-luz-forca, 0.4) * 34%),
        rgba(4, 6, 10, 0.96) 100%
      );
    border-left-color: transparent;
    border-right: 1px solid transparent;
  }
  /*
    O RIM — a borda acesa é a que ENCOSTA no corpo, e ela troca de lado com o painel.

    `border-left` fixo afirmava uma direção de luz que a cena não tem: com o painel à esquerda do
    astro, a aresta acesa ficava do lado escuro. É o termo `rim` de `space/bodies.js` pelo mesmo
    motivo — nenhum objeto num campo estelar tem lado completamente chapado.
  */
  .widget[data-panel-surface][data-ancora-lado="direita"] > .widget-body { border-left-color: var(--amber-dim); }
  .widget[data-panel-surface][data-ancora-lado="esquerda"] > .widget-body { border-right-color: var(--amber-dim); }
  .widget[data-panel-surface] .fs-title {
    /* O caminho do arquivo fica fixo ao rolar: sem isso você perde de vista o que está lendo. */
    position: sticky; top: -12px; z-index: 1;
    background: rgba(4,6,10,0.97); padding: 4px 0 6px;
    color: var(--amber); font-size: 9px; letter-spacing: 0.16em; word-break: break-all;
  }
  /* ---------------- página de configuração ---------------- */

  .config { display: grid; grid-template-columns: 132px 1fr; gap: 16px; align-items: start; }
  .config-menu { display: flex; flex-direction: column; gap: 4px; }
  /* Container flex encolhe os filhos: sem isto o rótulo da seção quebra em duas linhas. */
  .config-menu .btn { flex: 0 0 auto; justify-content: flex-start; white-space: nowrap; }
  .config-body { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  /* Quatro colunas: tipo, corpo celeste, barra, contagem. A linha é um botão de alternância —
     o histograma É o filtro, ver `apps/index.js:fs-shape`.

     ⚠️ O seletor precisa do `.btn` junto. `.btn[data-variant="row"]` já impõe
     `grid-template-columns: auto 1fr auto` e tem especificidade 0-2-0; um `.shape-row` sozinho
     (0-1-0) perde, e o sintoma é a quarta coluna colapsando para 0px — a barra some e a contagem
     quebra para a linha de baixo, sem nenhum erro em lugar nenhum. */
  .btn.shape-row { display: grid; grid-template-columns: 62px 58px 1fr 34px; gap: 8px;
                   align-items: center; padding: 2px 0; width: 100%; text-align: left;
                   background: none; border: 0; cursor: pointer; }
  .shape-name { color: var(--ink-dim); font-size: 8px; letter-spacing: 0.18em; }
  /* O corpo celeste que o tipo é. Mais apagado que o nome: é a glosa, não o dado. */
  .shape-body { color: var(--ink-faint); font-size: 8px; letter-spacing: 0.1em;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .shape-track { height: 3px; background: rgba(255, 179, 92, 0.08); }
  .shape-bar { display: block; height: 100%; }
  .shape-count { color: var(--ink-faint); font-size: 8px; text-align: right;
                 font-variant-numeric: tabular-nums; }
  .shape-row:hover .shape-name { color: var(--ink); }
  /* DESLIGADO: apaga e risca, mas a barra e a contagem continuam lá. O histograma existe para
     dizer de que o corpus é feito, e esse fato não muda porque o tipo saiu da tela — some a
     estrela, não o dado. */
  .shape-row[data-on="0"] { opacity: 0.38; }
  .shape-row[data-on="0"] .shape-name { text-decoration: line-through; }

  .config-profile { display: grid; grid-template-columns: 132px 1fr; gap: 10px;
                    align-items: baseline; padding: 3px 0; }
  .config-profile .btn { justify-content: center; }
  /*
    Grupo de escolhas mutuamente exclusivas dentro de uma linha de configuração.

    A linha PRECISA de coluna própria: `.config-profile` reserva 132px para um botão só, e quatro
    tempos espremidos ali passavam por cima da nota ao lado. Largura pelo conteúdo, com teto — a
    nota fica com o que sobrar.
  */
  .config-row-choices { grid-template-columns: minmax(0, max-content) 1fr; }
  .config-choices { display: flex; gap: 4px; max-width: 300px; }
  .config-choices .btn { flex: 1 1 auto; justify-content: center; white-space: nowrap; }
  .config-profile-note { color: var(--ink-faint); font-size: 8px; letter-spacing: 0.14em; }
  .config-key { display: grid; grid-template-columns: 68px 1fr auto; gap: 10px;
                align-items: baseline; padding: 2px 0; }
  .config-kbd { color: var(--amber); font: inherit; font-size: 10px; letter-spacing: 0.1em; }
  .config-key-label { color: var(--ink-dim); font-size: 9px; letter-spacing: 0.16em; }
  .config-key-note { color: var(--ink-faint); font-size: 7.5px; letter-spacing: 0.14em;
                     font-style: normal; }

  .hover-meta { color: var(--ink-dim); font-size: 9px; letter-spacing: 0.16em; padding-top: 2px; }
  .widget-error { color: var(--bad); font-size: 9px; }
  .widget-empty { color: var(--ink-faint); font-size: 9px; line-height: 1.5; }
  .widget-hint { font-style: normal; color: var(--ink-faint); }

  /* Depósito: fora de tela, dentro do documento — nó removido perde medida. */
  .attic { position: fixed; left: -9999px; top: 0; width: 320px; height: 1px; overflow: hidden; }

  /*
    Transição de rota. Os widgets somem no começo do voo e voltam perto do fim; o router
    escalona os dois instantes, e é esse desalinho que faz ler como chegada, não como corte.
  */
  #hud .slot { transition: opacity 380ms ease, transform 520ms cubic-bezier(0.16, 1, 0.3, 1); }
  body.in-flight #hud .slot { opacity: 0; transform: translateY(12px); }

  /* Dock: os apps como destinos, com o atalho numérico visível. */
  .dock { grid-column: 1 / -1; display: flex; gap: 6px; justify-content: center;
          padding-top: 6px; transition: opacity 260ms ease; }
  /*
    A DOCK SE SUSPENDE QUANDO ALGO ESTÁ EM CURSO.

    Ela é o menu de DESTINOS, e destino só é uma pergunta em repouso. Com um astro travado, um
    painel aberto ou um arquivo em leitura, a pergunta do operador deixou de ser "para onde eu
    vou" e virou "o que é isto" — e a dock passa a competir por atenção com o objeto que ele
    acabou de escolher, na faixa logo acima do prompt.

    `visibility` junto de `opacity`, não `display: none`: a dock é `grid-column: 1 / -1` numa
    grade, e removê-la do fluxo faria o prompt e o rodapé PULAREM meio passo a cada foco. O
    espaço fica reservado; só a tinta sai.
  */
  body.at-work .dock { opacity: 0; visibility: hidden; }
  /*
    A dock é o primitivo `select` com acento por app — uma rota ativa entre N é exatamente um
    conjunto exclusivo. Só o que sobra aqui é o que é DA DOCK e não do botão: o ponto de cor e a
    tecla de atalho, e a folga extra que um item de destino pede em relação a um chip de opção.
  */
  .dock .btn { padding: 5px 11px; }
  .dock-key { color: var(--ink-faint); font-size: 7.5px; }
  .dock .btn[data-on="true"] .dock-key { color: rgba(0, 0, 0, 0.5); }
  .dock-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--btn-accent); }
  .dock .btn[data-on="true"] .dock-dot { background: var(--void); }

  /* Rótulos dos corpos: DOM posicionado pela projeção da câmera, para usar a fonte da HUD. */
  #bodies { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  .body-label {
    position: absolute; top: 0; left: 0; pointer-events: auto; cursor: pointer;
    background: none; border: none; font: inherit; font-size: 9px; letter-spacing: 0.22em;
    color: var(--ink-dim); display: inline-flex; align-items: center; gap: 6px;
    white-space: nowrap; padding: 3px 6px; transition: color 160ms ease;
  }
  .body-label:hover, .body-label[data-active="true"] { color: var(--body-color); }
  .body-key { color: var(--ink-faint); font-size: 7.5px; border: 1px solid var(--line); padding: 0 3px; }
  /* Controle: rótulo menor e mais discreto que app — ele alterna algo, não é destino. */
  .body-label.body-control { font-size: 7.5px; letter-spacing: 0.26em; }
  .body-label.body-control .body-name { opacity: 0.75; }

  /* ---------------- widgets dos apps ---------------- */

  .kv { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 3px 0; align-items: baseline; }
  .kv-label { color: var(--ink-faint); font-size: 8.5px; letter-spacing: 0.18em; }
  .kv-value { color: var(--ink); font-size: 10.5px; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; max-width: 15em; }

  .unit { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center;
          padding: 4px 0; }
  .unit.down { opacity: 0.45; }
  .unit.warn .unit-name { color: var(--busy); }
  .unit-name { color: var(--ink-dim); font-size: 9.5px; letter-spacing: 0.12em; }
  .unit-detail { color: var(--ink-faint); font-size: 8.5px; }
  .unit-sub { grid-column: 2 / -1; color: var(--ink-faint); font-size: 8px; line-height: 1.5; }

  .fs-crumb { display: flex; align-items: center; gap: 3px; flex-wrap: wrap; padding-bottom: 6px;
              border-bottom: 1px solid var(--line); margin-bottom: 5px; }
  .fs-crumb-part { background: none; border: none; color: var(--amber-dim); font: inherit;
                   font-size: 8.5px; cursor: pointer; padding: 0; }
  .fs-crumb-part:hover { color: var(--amber); }
  .fs-crumb-sep { color: var(--ink-faint); font-size: 8.5px; }
  /* A linha de arquivo é o primitivo na variante `row`; aqui ficam só as células dela. */
  .fs-glyph { color: var(--amber-dim); font-size: 8px; }
  .fs-name { font-size: 9.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fs-meta { color: var(--ink-faint); font-size: 8px; }
  .btn[data-entry="dir"] .fs-name { color: var(--amber-dim); }
  .fs-title { color: var(--amber-dim); font-size: 8.5px; letter-spacing: 0.18em;
              padding-bottom: 6px; border-bottom: 1px solid var(--line); }
  .fs-search { width: 100%; background: none; border: none; border-bottom: 1px solid var(--line);
               color: var(--ink); font: inherit; font-size: 10px; outline: none; padding: 4px 0;
               margin-bottom: 6px; }
  /* Os resultados rolam; o campo de busca acima deles nunca sai da tela. */
  .fs-results { display: flex; flex-direction: column; gap: 2px; min-height: 0; overflow-y: auto; }

  /*
    FAVORITO. A marca é a única coisa deste painel que não é medida, e os quatro estados dela têm
    de se distinguir SEM texto extra — quem lê de relance vê o glifo e a tinta.

    `nao-marcado` não chega aqui: ele é uma linha de ação (`btn[data-variant="row"]`), sem faixa,
    porque não há nada a anunciar. `degradada` é ANÚNCIO e usa `--busy`, o âmbar de atenção da HUD:
    desenhá-la em cinza a faria ler como ausência, que é o oposto de "marquei e não vale mais aqui".
    `--bad` seria errado — a marca não quebrou, ela continua guardada.
  */
  .marca { display: grid; grid-template-columns: auto 1fr; gap: 6px; align-items: baseline;
           padding: 4px 0 2px; }
  .marca-glifo { color: var(--ink-faint); font-size: 10px; }
  .marca-texto { color: var(--ink-dim); font-size: 9px; letter-spacing: 0.18em; }
  .marca[data-estado="marcada"] .marca-glifo,
  .marca[data-estado="sem-aparencia"] .marca-glifo { color: var(--amber); }
  .marca[data-estado="degradada"] .marca-glifo,
  .marca[data-estado="degradada"] .marca-texto { color: var(--busy); }
  /* O motivo do modelo, na íntegra: é ele que nomeia QUAL das três causas degradou a marca. */
  .marca-motivo { grid-column: 2; color: var(--ink-faint); font-size: 8px; line-height: 1.5; }
  /* A procedência tem a identidade do rótulo sem o peso dele — ela é assinatura, não valor. */
  .marca-proveniencia { color: var(--amber-faint); font-size: 8px; letter-spacing: 0.14em;
                        padding-bottom: 4px; }
  .marca-aparencias { display: flex; flex-wrap: wrap; gap: 4px; padding: 4px 0; }

  /*
    Scrubber da janela temporal. Hairline: a pista é uma linha, a frente revelada é a mesma
    linha em âmbar, e o playhead é um traço vertical. Sem trilho, sem knob, sem caixa.
  */
  .scrub { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; }
  /*
    `pointer-events: auto` NÃO é redundante aqui, e a falta dele foi um bug relatado ("não
    consigo clicar pra controlar a timeline"). O `#hud` é `pointer-events: none` para não roubar
    o arraste da câmera, e a regra que reativa cobre só `a`, `button`, `input` e `.clickable` —
    uma pista de scrub é um `div`, então ela desenhava e não recebia clique nenhum.

    A altura de 20px também é funcional: o traço visível é hairline de 1px, mas um alvo de 1px é
    inacertável com o mouse. A faixa é a área de acerto; a linha é só o que se vê.
  */
  .scrub-track {
    position: relative; height: 16px; cursor: ew-resize; outline: none;
    pointer-events: auto;
    /* touch-action: sem isso o arraste no trackpad/touch vira scroll da página no meio do gesto. */
    touch-action: none;
  }
  .scrub-track::before {
    content: ''; position: absolute; left: 0; right: 0; top: 50%;
    border-top: 1px solid var(--line);
  }
  .scrub-track:focus-visible::before { border-color: var(--amber-dim); }
  .scrub-front {
    position: absolute; left: 0; top: 50%; height: 0; border-top: 1px solid var(--amber-dim);
  }
  .scrub-head {
    position: absolute; top: 3px; bottom: 3px; width: 1px; background: var(--amber);
    transform: translateX(-0.5px); pointer-events: none;
  }
  .scrub-ticks { position: absolute; inset: 0; pointer-events: none; }
  /* Marca de virada de mês, com o rótulo no `title` do elemento pai — a pista é estreita. */
  .scrub-tick { position: absolute; top: 3px; bottom: 3px; width: 1px; background: var(--ink-faint); }
  .scrub-tick::after {
    content: attr(data-label); position: absolute; left: 2px; top: -1px;
    font-size: 6.5px; letter-spacing: 0.14em; color: var(--ink-faint); white-space: nowrap;
  }
  /*
    A leitura da timeline ocupava uma linha própria abaixo da pista, e a barra inteira dava 12,2%
    da altura da tela para transmitir uma data e uma contagem. Agora ela vive NA MESMA LINHA da
    pista, à direita — mesma informação, um terço do espaço.
  */
  .scrub-readout { display: flex; gap: 9px; align-items: baseline; padding-top: 0; }
  /* A data é o único nível 1 daqui: é ela que responde "que instante estou vendo". */
  .scrub-date { color: var(--ink); font-size: 9.5px; letter-spacing: 0.14em; }
  .scrub-count { color: var(--ink-faint); font-size: 8px; letter-spacing: 0.12em; }
  .scrub-note { color: var(--ink-faint); font-size: 7.5px; letter-spacing: 0.12em; }

  .delivery { display: grid; grid-template-columns: auto auto 1fr auto; gap: 9px; align-items: baseline;
              padding: 3px 0; font-size: 9px; }
  .delivery-source { color: var(--amber-dim); font-size: 8px; letter-spacing: 0.18em; }
  .delivery-summary { color: var(--ink-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .delivery-meta { color: var(--ink-faint); font-size: 8px; }

  /*
    Os três painéis de configuração não declaram mais posição própria: quem posiciona é
    `.surface[data-surface="overlay"]`. Cada um tinha o seu canto (afinação à esquerda,
    permissões à direita, voz à esquerda), com regra própria para APAGAR a coluna que ficava
    embaixo — três molduras, três comportamentos, e a coluna sumindo por baixo de um painel que
    o operador não pediu para trocar. Centrados sobre a cena, não há coluna a apagar.
  */
  .bench { display: flex; flex-direction: column; gap: 5px; padding-bottom: 4px; }
  .bench .btn { align-self: flex-start; }
  .chips { display: flex; flex-direction: column; }

  /* ---------------- painel de afinação ---------------- */

  .controls { gap: 1px; }
  #hud aside { transition: opacity 320ms ease; }
  #hud aside.dimmed { opacity: 0; pointer-events: none; }
  .controls-head { display: flex; justify-content: space-between; align-items: baseline;
                   border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
  .controls-title { color: var(--amber); font-size: 9px; letter-spacing: 0.34em; }
  .controls-reset { background: none; border: none; color: var(--ink-faint); font: inherit;
                    font-size: 8px; letter-spacing: 0.2em; cursor: pointer; }
  .controls-reset:hover { color: var(--amber); }
  .controls-group { color: var(--ink-faint); font-size: 8px; letter-spacing: 0.3em;
                    margin: 12px 0 4px; }
  .controls-group:first-of-type { margin-top: 0; }
  .controls-note { color: var(--busy); font-size: 7.5px; letter-spacing: 0.16em; line-height: 1.5;
                   padding: 4px 0 2px; }
  .controls-note[hidden] { display: none; }
  .controls-hint { color: var(--ink-faint); font-size: 7.5px; letter-spacing: 0.18em;
                   margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--line); }

  .control { display: flex; flex-direction: column; gap: 3px; padding: 3px 0; cursor: pointer; }
  .control-head { display: flex; justify-content: space-between; gap: 8px; }
  .control-label { color: var(--ink-dim); font-size: 8.5px; letter-spacing: 0.14em; }
  .control-value { color: var(--amber); font-size: 9px; font-variant-numeric: tabular-nums; }

  /* Slider hairline: trilha de 1px e polegar quadrado, para não parecer controle de sistema. */
  .control-slider { -webkit-appearance: none; appearance: none; width: 100%; height: 10px;
                    background: none; cursor: pointer; }
  .control-slider::-webkit-slider-runnable-track { height: 1px; background: var(--line); }
  .control-slider::-moz-range-track { height: 1px; background: var(--line); }
  .control-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 8px; height: 8px; margin-top: -3.5px;
    background: var(--amber); border: none; transition: transform 140ms ease;
  }
  .control-slider::-moz-range-thumb { width: 8px; height: 8px; background: var(--amber); border: none; }
  .control-slider:hover::-webkit-slider-thumb { transform: scale(1.4); }

  /* ---------------- painel de permissões ---------------- */


  .perms-body { overflow-y: auto; display: flex; flex-direction: column; gap: 1px; min-height: 0; }
  .perms-recovered {
    color: var(--busy); font-size: 8px; letter-spacing: 0.14em; line-height: 1.5;
    border-left: 2px solid var(--busy); padding: 4px 0 4px 8px; margin: 6px 0;
  }
  .perms-recovered[hidden] { display: none; }
  .perms-status { color: var(--ink-faint); font-size: 8px; letter-spacing: 0.16em; }

  .perm { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start;
          padding: 4px 0; cursor: pointer; }
  .perm.off { opacity: 0.42; }
  .perm-box { appearance: none; -webkit-appearance: none; width: 9px; height: 9px; margin-top: 3px;
              border: 1px solid var(--ink-faint); background: none; cursor: pointer;
              transition: background 160ms ease, border-color 160ms ease; }
  .perm-box:checked { background: var(--amber); border-color: var(--amber); }
  .perm-text { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
  .perm-name { color: var(--ink); font-size: 9.5px; letter-spacing: 0.1em; }
  /* Mesma paleta de família das ferramentas na cena: o olho já aprendeu essas cores. */
  .perm-name[data-kind="filesystem"] { color: #6ee7a0; }
  .perm-name[data-kind="shell"] { color: #d8c9a8; }
  .perm-name[data-kind="browser"] { color: #ff9b4a; }
  .perm-name[data-kind="agent"] { color: #c59bff; }
  .perm-name[data-kind="planner"] { color: #8fa3bd; }
  .perm-desc { color: var(--ink-faint); font-size: 8.5px; line-height: 1.4;
               max-height: 2.9em; overflow: hidden; }
  .perm-empty { color: var(--ink-faint); font-size: 8.5px; padding: 3px 0; }

  .perm-modes { display: flex; flex-wrap: wrap; gap: 4px; padding: 2px 0 6px; }

  .perms-flagsbox { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 8px; }
  /*
    Provisório: o comando resultante é calculado pelo SERVIDOR, então num render otimista ele
    ainda é o de antes. A opacidade reduzida é o que impede a "prova" de mentir por meio segundo.
  */
  .perms-flagsbox[data-pending="true"] { opacity: 0.4; }

  /*
    Reversão visível. Não é decoração: só aparece quando um POST de configuração FALHOU e a tela
    voltou ao estado que o servidor tem. Sem isto, reverter era indistinguível de nunca ter
    clicado — e o motivo ficava num texto de 7px que ninguém lê.
  */
  .perms[data-reverted="true"] { border-color: var(--bad); }
  .perms[data-reverted="true"] .perms-status { color: var(--bad); }
  @media (prefers-reduced-motion: no-preference) {
    .perms[data-reverted="true"] { animation: revert-flash 1.2s ease both; }
    @keyframes revert-flash { 0%, 32% { background: rgba(255, 107, 82, 0.13); } }
  }
  .perms-flags { display: block; color: var(--ink-dim); font-size: 8px; line-height: 1.55;
                 word-break: break-all; font-family: inherit; }
  .perms-hint { color: var(--ink-faint); font-size: 7.5px; letter-spacing: 0.18em; margin-top: 10px; }

  /* ---------------- boot ---------------- */

  #boot {
    position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 22px;
    background: radial-gradient(circle at 50% 45%, #0b0806 0%, var(--void) 62%);
    transition: opacity 1.2s ease, filter 1.2s ease;
  }
  #boot.gone { opacity: 0; filter: blur(14px); pointer-events: none; }
  /*
   * ⚠️ O ESPACEJAMENTO ERA 0,7em, e ele tinha de cair com a mudança de nome.
   *
   * Aquele valor servia a `ESPATIAL` em caixa alta, que é um RÓTULO — texto espaçado lê como
   * inscrição, e é assim que se compõe uma palavra em versalete. `SpatIA` é uma MARCA, e marca é
   * uma palavra só: com 0,7em as seis letras viram seis objetos separados e o `IA` deixa de ser
   * lido como unidade, que é a única razão de a identidade ter escolhido essa caixa
   * (`docs/README.md`). Espacejamento apertado e corpo maior é o que a referência da marca pede.
   */
  #boot h1.marca { color: var(--amber); letter-spacing: 0.02em; font-size: 34px; font-weight: 300; }
  #boot .sub { color: var(--ink-faint); font-size: 9px; letter-spacing: 0.32em; }
  .boot-log { display: flex; flex-direction: column; gap: 18px; width: min(560px, 84vw); margin-top: 8px; }
  /*
    Os dois blocos NOMEADOS — `CÉU` e `SUBSISTEMAS` — são duas perguntas, não uma lista longa
    partida ao meio para caber. O cabeçalho é nível 3 da rampa (`--amber-faint`) e a régua que o
    acompanha é nível 4: mobília nunca disputa com o dado que ela separa.
  */
  .boot-group { display: flex; flex-direction: column; gap: 3px; animation: reveal 320ms ease both; }
  .boot-group-title { display: flex; align-items: center; gap: 10px; margin: 0 0 3px;
                      color: var(--amber-faint); font-size: 8px; font-weight: 400;
                      letter-spacing: 0.3em; }
  .boot-group-title::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .boot-group-lines { display: flex; flex-direction: column; gap: 3px; }
  .boot-line { display: grid; grid-template-columns: auto 1fr; gap: 14px; font-size: 9.5px;
               border-bottom: 1px solid rgba(255,255,255,0.04); padding: 3px 0;
               animation: reveal 320ms ease both; }
  /*
    O valor é a coluna ELÁSTICA, e o rótulo é que se ajusta ao conteúdo. Invertido, a leitura do
    disco — que é longa e chega tarde — quebrava em duas linhas e empurrava o gate para baixo
    depois de o operador já ter lido a tela.
  */
  .boot-value { text-align: right; }
  @keyframes reveal { from { opacity: 0; transform: translateY(-3px); } }
  @keyframes slide-in { from { opacity: 0; transform: translateX(-6px); } }

  /* ---------------- movimento reduzido ---------------- */
  /*
    `prefers-reduced-motion` obedecido do lado do CSS. A media query é usada DIRETO, e não o
    `data-motion` que o `core/motion.js` escreve: se o JS falhar no boot, a preferência ainda vale.
    O atributo existe para o painel de afinação poder dizer que está reduzido.

    O que sai: deslocamento e pulso. O que FICA: a mudança de opacidade e de cor — é ela que
    carrega a informação de "isto é novo" e de "este serviço caiu". Apagar tudo tiraria o
    feedback junto com o movimento.
  */
  @media (prefers-reduced-motion: reduce) {
    .row, .hit, .tool, .aviso, .answer, .sources, .answer-meta,
    .inspector.open, .controls.open, .perms.open {
      animation-name: fade-only;
      animation-duration: 160ms;
    }
    @keyframes fade-only { from { opacity: 0; } }

    /* Pulsar é o gesto mais desconfortável da tela e o mais fácil de substituir: um ponto
       aceso em opacidade plena diz "ocupado" tão bem quanto um que pisca. */
    .dot[data-status="busy"], .dot[data-state="thinking"], .dot[data-state="answering"],
    .dot[data-state="retrieving"], .dot[data-state="searching"],
    .btn[data-variant="icon"][data-tone="bad"] svg {
      animation: none;
    }

    /* A saída/entrada dos widgets no voo de rota vira corte: o router já zera os dois tempos. */
    #hud .slot { transition: none; }
    body.in-flight #hud .slot { transform: none; }
    #hud { transition: none; }
  }
  .boot-label { color: var(--ink-faint); letter-spacing: 0.2em; }
  .boot-line.ok .boot-value { color: var(--ink-dim); }
  .boot-line.bad .boot-label, .boot-line.bad .boot-value { color: var(--bad); }
  /* `warn` é o corte que ainda deixa entrar — seção que não coube em órbita, disco sem anel. */
  .boot-line.warn .boot-value { color: var(--busy); }
  .boot-status { color: var(--ink-dim); font-size: 9.5px; letter-spacing: 0.16em; min-height: 1.2em; }
  /*
    Só o LAYOUT da fileira. A aparência dos dois botões vem do primitivo `.btn` (`hud/button.js`)
    como a de qualquer outro botão do sistema.

    Aqui havia um bloco `#boot button { ... }`, herdado do ENGATAR removido, que redefinia
    borda, cor, fonte e padding. Ele não era só código morto: `#boot button` tem especificidade
    de ID e vencia `.btn[data-variant]`, então qualquer botão colocado nesta tela sairia do
    sistema de design sem ninguém pedir — o sétimo fork que o primitivo existe para impedir.
  */
